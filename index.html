<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta name="facebook-domain-verification" content="9dosd7z1s8p9kvh7r6vrhpbqivij5o" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنصة التفاعلية — المناهج العُمانية</title>
<link rel="stylesheet" href="css/style.css?v=20260721-41">
<!-- نظام واجهة شوجب (مهارة shoogp-ui) — مبوّب على درس نموذج واحد فقط عبر .shoogp-ui -->
<link rel="stylesheet" href="css/shoogp-ui.css?v=20260721-41">
<!-- قفل الوحدات ونافذة رمز الفتح (القاعدة كاملةً في js/unlock.js) -->
<link rel="stylesheet" href="css/unlock.css?v=20260721-41">
<!-- طبقةُ الخلفيةِ الفضائيةِ — الصفحةُ الرئيسةُ وحدَها (لا pay.html ولا privacy.html) -->
<link rel="stylesheet" href="css/space-bg.css?v=20260721-41">
</head>
<body>
  <div class="space-bg" aria-hidden="true">
    <i class="sb-rocket"></i>
    <i class="sb-moon"></i>
    <i class="sb-saturn"></i>
    <i class="sb-planet"></i>
  </div>

  <div class="stars" id="stars"></div>

  <div class="app">
    <header>
      <button class="sound-btn" id="soundBtn" type="button"
        title="كتم/تشغيل الصوت" aria-label="كتم أو تشغيل الصوت">🔊</button>
      <div class="logo-wrap">
        <img class="logo" src="images/logo-mark.png" alt="شوجب">
      </div>
      <h1 class="main-title">منصّتك للأنشطة التعليمية التفاعلية</h1>
    </header>

    <!-- ① الشاشة الرئيسية: الفصل + الصفوف + الكتب -->
    <section class="screen active" id="home">
      <p class="choose-line">اختر صفّك ثم كتابك، ولننطلق في المغامرة!</p>
      <div class="terms" id="terms"></div>
      <div class="grades" id="grades"></div>
      <div class="books" id="books"></div>
    </section>

    <!-- ③ شاشة الدروس -->
    <section class="screen" id="lessonsScreen">
      <button class="back" onclick="goHome()">→ رجوع للكتب</button>
      <div class="screen-title" id="bookTitle"></div>
      <div class="screen-sub" id="bookSub"></div>
      <div class="lessons" id="lessons"></div>
    </section>

    <!-- ④ شاشة النشاط: أسئلة الدرس (تُبنى بالكود) -->
    <section class="screen" id="activityScreen">
      <button class="back" onclick="backToLessons()">→ رجوع للدروس</button>
      <!-- سطرُ الدرس: عنوانُ الدرسِ في طرفٍ وشعارُ شوجب في الطرفِ المقابل، على سطرٍ واحدٍ
           فوقَ حاويةِ السؤال. الشعارُ يُخفى من الترويسةِ في هذه الشاشةِ وحدَها (css/style.css)،
           وموضعُه في صفحاتِ التنقّلِ (الرئيسيةِ وقائمةِ الدروس) لا يُمَسّ. -->
      <div class="lesson-head">
        <div class="screen-title" id="lessonTitle"></div>
        <img class="lesson-logo" src="images/logo-mark.png" alt="شوجب">
      </div>
      <div class="screen-sub">أجب عن الأسئلة وأطلق صاروخك إلى القمر 🚀</div>
      <!-- شريطُ استماعِ الدرس: يُبنى من `ls.audio` في `openLesson` ويبقى مخفيّاً في كلِّ
           درسٍ بلا تسجيل. موضعُه في الترويسةِ فوقَ حاويةِ السؤالِ عمداً — الأسئلةُ تُعرَضُ
           واحداً واحداً، فزرٌّ داخلَ سؤالٍ يغيبُ عن بقيّتِها؛ وهنا يبقى مع الدرسِ كلِّه. -->
      <div class="lesson-audio" id="lessonAudio" hidden></div>
      <div id="questionList"></div>
    </section>

    <p class="hint">💡 مصمَّم للمس على السبورة · التغذية الصوتية العربية تعمل بعد أول لمسة</p>
    <p class="site-foot"><a href="pay.html">شراء كتاب</a> · <a href="privacy.html">سياسة الخصوصية</a></p>
  </div>

<!-- ملاءمة العرض (fit to viewport): تحجيم موحّد لتملأ الواجهةُ عرضَ النافذة. يُحمّل أولاً ليضبط zoom قبل الرسم -->
<script src="js/fit.js?v=20260721-41"></script>
<!-- وحدة الصوت الموحّدة: قبل rocket.js/app.js لأنّ كليهما يستدعي SHOOGP_SFX عند التعزيز -->
<script src="js/sfx.js?v=20260721-41"></script>
<script src="js/data.js?v=20260721-41"></script>
<script src="js/questions.js?v=20260721-41"></script>
<script src="js/qpics.js?v=20260721-41"></script>
<script src="js/rocket.js?v=20260721-41"></script>
<!-- قفل الوحدات: قبل app.js لأنّ openBook/openLesson يقرآن window.ShoogpLock -->
<script src="js/unlock.js?v=20260721-41"></script>
<script src="js/app.js?v=20260721-41"></script>
<!-- سكربت تفعيل نظام الواجهة (يرقّع openLesson لكامل كتاب علوم ص٤ g4-sci، لا يمسّ app.js) -->
<script src="js/shoogp-ui.js?v=20260721-41"></script>
</body>
</html>
