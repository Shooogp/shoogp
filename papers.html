<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الأوراق الورقية — العلوم</title>

<!-- 🔧 حارسُ وضعِ المطوِّر (قرارُ المالك ٢٠٢٦-١١-١١): الصفحةُ في وضعِ المطوِّرِ أولاً قبلَ أن تراها المعلّمات.
     لفتحِها للعموم: `DEV_ONLY = false`. ⚠️ حجبٌ لا تأمين. -->
<script>
  var DEV_ONLY = true;
  var isDev = false;
  try {
    var m = /[?&]dev=([^&#]*)/.exec(location.search || '');
    if (m && decodeURIComponent(m[1]) === 'shoogp2026') localStorage.setItem('shoogp-dev', '1');
    isDev = localStorage.getItem('shoogp-dev') === '1';
    if (m && history.replaceState) history.replaceState(null, '', location.pathname);
  } catch (e) {}
  document.documentElement.classList.add(!DEV_ONLY || isDev ? 'is-open' : 'is-closed');
</script>

<!--
  ═══════════════════════════════════════════════════════════════
  الأوراقُ الورقيةُ — مكتبةُ أوراقِ التقويمِ المكتوبةِ في العلوم (الفصلُ الأول)
  • المصدرُ: data/papers/sci-g<الصف>.json — أوراقٌ ولّدها «شوجب — وكيل الأوراق الورقية» (n8n)
    بتعليماتِ وثيقةِ تقويمِ المجالِ الثاني ١–٤ (سبتمبر ٢٠٢٦)، وفحصَها الفاحصُ الآليُّ (tools/papers/validate.cjs).
  • الأنواع: أسئلةٌ قصيرةٌ (المعرفةُ والفهم) لكلِّ درس، وأسئلةُ الاستقصاءِ للصفّينِ ١–٢ لكلِّ وحدة،
    واختبارٌ قصيرٌ للصفّينِ ٣–٤ لكلِّ وحدة.
  • الطباعةُ بالأبيضِ والأسودِ على A4، بلا هويةِ شوجب (قرارُ المالك)، وورقةُ التلميذِ ودليلُ التصحيحِ منفصلان.
  • ترتيبُ عناصرِ التوصيلِ والترتيبِ والبنوكِ يُخلَطُ بمولّدٍ ثابتٍ ببذرةِ معرّفِ الورقة، فتطابقُ كلُّ طباعةٍ الأخرى.
  ═══════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html.is-closed .app{display:none}
  html.is-open .closed{display:none}
  body{font-family:'Tajawal',sans-serif;background:#eceef2;color:#111}
  .closed{max-width:520px;margin:20vh auto;text-align:center;font-size:1.2rem;color:#555}

  /* ── أدوات الشاشة ── */
  .bar{background:#1d2340;color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
  .bar h1{font-size:1.05rem;font-weight:800;margin-left:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid #5b6390;background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font:700 .9rem 'Tajawal';cursor:pointer}
  .chip.on{background:#ffb347;border-color:#ffb347;color:#1d2340}
  .chip:disabled{opacity:.35;cursor:default}
  .sep{width:1px;height:26px;background:#4a5080;margin:0 4px}
  .layout{display:flex;gap:16px;padding:16px;align-items:flex-start}
  .side{width:280px;flex:0 0 280px;background:#fff;border-radius:12px;padding:12px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:76px}
  .side h3{font-size:.85rem;color:#666;margin:10px 4px 6px}
  .pick{display:block;width:100%;text-align:right;border:0;background:#f4f5f9;border-radius:8px;padding:8px 10px;margin:4px 0;font:500 .9rem 'Tajawal';cursor:pointer;color:#222}
  .pick.on{background:#1d2340;color:#fff}
  .pick small{display:block;color:#888;font-size:.75rem}
  .pick.on small{color:#cfd3ea}
  .pick.bad{border-right:4px solid #d33}
  .main{flex:1;min-width:0}
  .views{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .views .chip{color:#1d2340;border-color:#1d2340}
  .views .chip.on{background:#1d2340;color:#fff}
  .print-btn{margin-right:auto;background:#2e7d32;border:0;color:#fff;border-radius:8px;padding:8px 16px;font:700 .95rem 'Tajawal';cursor:pointer}
  .empty{background:#fff;border-radius:12px;padding:40px;text-align:center;color:#777}
  .warn{background:#fff4e5;border:1px solid #f0b46a;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.85rem;color:#7a4a00}

  /* ── الورقة A4 ── */
  .sheet{width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;padding:9mm 12mm;box-shadow:0 2px 10px rgba(0,0,0,.12);
    font-family:'Noto Naskh Arabic',serif;font-size:13.5pt;line-height:1.7;color:#000}
  .hdr{border:1.5px solid #000;border-radius:6px;padding:6px 10px;margin-bottom:6mm}
  .hdr-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #000;padding-bottom:4px;margin-bottom:6px;font-family:'Tajawal';font-weight:700;font-size:11.5pt}
  .hdr-title{font-size:15pt;font-weight:800}
  .fields{display:grid;grid-template-columns:1.4fr 1fr;gap:4px 18px;font-size:11.5pt;font-family:'Tajawal'}
  .fields span{white-space:nowrap}
  .fields .dots{display:inline-block;border-bottom:1px dotted #000;min-width:58%;transform:translateY(-3px)}
  .meta{display:flex;gap:18px;flex-wrap:wrap;font-family:'Tajawal';font-size:11pt;margin-top:4px}
  .note{font-family:'Tajawal';font-size:10.5pt;margin-top:4px}
  /* ترويسةُ النموذج المعتمد (٢٠٢٦-١١-١١): مربّعُ الدرجة · العنوان · الاسم والصفّ والمدرسة */
  .phdr{display:flex;gap:4mm;align-items:flex-start;margin-bottom:3.5mm;font-family:'Tajawal'}
  .gbox{border-collapse:collapse;font-weight:800;font-size:11pt;flex:0 0 auto}
  .gbox td{border:1.5px solid #000;padding:1mm 2mm;text-align:center;height:9mm;min-width:12mm;line-height:1.3}
  .gbox td.lb{min-width:20mm}
  .tbox{flex:1;border:1.5px solid #000;padding:1.5mm 3mm;font-weight:800;font-size:13.5pt;text-align:center;line-height:1.45;align-self:stretch;display:flex;align-items:center;justify-content:center}
  .sbox{flex:0 0 auto;border:1.5px solid #000;padding:1mm 3mm;font-size:11.5pt;font-weight:700;line-height:1.9}
  .sbox .dots{display:inline-block;width:30mm;border-bottom:1.2px dotted #000;margin-right:1mm}
  /* ترويسةُ الوزارة (طلبُ المالك ٢٠٢٦-١١-١١): الشعارُ فوقَ أربعةِ أسطر، والمحافظةُ والمدرسةُ من إعدادِ المعلّمة */
  .moe{display:flex;flex-direction:column;align-items:center;width:fit-content;margin:0 0 2.5mm;font-family:'Tajawal';font-weight:800;font-size:10.5pt;line-height:1.32}
  .moe img{height:25mm;width:auto;display:block;margin-bottom:1mm}
  .moe .ln2{text-align:center}
  .moe .fill{display:inline-block;min-width:34mm;border-bottom:1.2px dotted #000;transform:translateY(-3px)}
  .hdrset{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:.9rem}
  .hdrset label{display:flex;gap:6px;align-items:center;font-weight:700;color:#1d2340}
  .hdrset select,.hdrset input[type=text]{font:500 .9rem 'Tajawal';border:1px solid #c5c9da;border-radius:6px;padding:5px 8px;min-width:150px}
  .hdrset input[type=text]{min-width:220px}
  .hdrset small{color:#888}
  table.items{width:100%;border-collapse:collapse}
  table.items th,table.items td{border:1.5px solid #000;vertical-align:top;padding:1.5mm 2.5mm}
  table.items th{font-family:'Tajawal';font-weight:800;font-size:12pt;text-align:center;vertical-align:middle}
  table.items td.n{width:13mm;text-align:center;font-family:'Tajawal';font-weight:800}
  table.items td.m{width:16mm;text-align:center;font-family:'Tajawal';font-weight:800;font-size:11.5pt}
  tr.item{break-inside:avoid;page-break-inside:avoid}
  .stem{font-weight:700}
  .circ{display:inline-block;width:13px;height:13px;border:1.6px solid #000;border-radius:50%;vertical-align:middle;margin-left:2mm}
  .copts{display:flex;flex-wrap:wrap;gap:2mm 10mm;font-weight:700}
  .copts.col{flex-direction:column}
  .copts.two{display:grid;grid-template-columns:1fr 1fr;gap:1mm 6mm}
  /* رسومُ شوجب في الورقة (سِجلّ js/qpics.js) — رماديّةٌ كما تُطبَع */
  .pc{display:inline-flex;flex-direction:column;align-items:center;gap:.5mm;vertical-align:middle}
  .pc .qpic-img,.pc svg{width:16mm;height:16mm;object-fit:contain;filter:grayscale(1) contrast(1.15)}
  .pc b{font-weight:700;font-size:11.5pt;line-height:1.3}
  .pbox{border:1.3px solid #000;border-radius:4px;padding:1mm 2.5mm}
  .popts{display:flex;flex-wrap:wrap;gap:3mm 9mm;justify-content:flex-start;align-items:flex-end}
  .popt{display:inline-flex;flex-direction:column;align-items:center;gap:1mm;font-weight:700}
  .spic{float:left;margin:0 4mm 1mm 0}
  .spic .qpic-img,.spic svg{width:17mm;height:17mm;object-fit:contain;filter:grayscale(1) contrast(1.15)}
  .scene{display:flex;gap:6mm;justify-content:center;margin:1mm 0 1.5mm}
  .drawbox{border:1.3px dashed #000;height:36mm;border-radius:6px;margin-top:1mm}
  .match.pics{row-gap:4mm}
  /* التوصيلُ عمودانِ مستقلّان: (أ) بطاقاتُه مصوَّرةٌ أفقيّة، و(ب) يتوزّعُ على الطولِ نفسِه — فلا صفَّ فارغاً للبندِ الزائد */
  .m2{display:flex;justify-content:space-between;align-items:stretch;gap:18mm;margin-top:1mm}
  .m2 .col{display:flex;flex-direction:column;justify-content:space-around;gap:2mm}
  .m2 .hd{font-weight:800}
  .m2 .r{display:flex;align-items:center;gap:3mm}
  .pch{display:inline-flex;align-items:center;gap:2mm;border:1.3px solid #000;border-radius:4px;padding:.8mm 2.5mm .8mm 2mm}
  .pch .qpic-img,.pch svg{width:10.5mm;height:10.5mm;object-fit:contain;filter:grayscale(1) contrast(1.15)}
  .pch b{font-weight:700;font-size:11.5pt;line-height:1.3}
  .item{margin:0 0 6mm;break-inside:avoid;page-break-inside:avoid}
  .qh{display:flex;gap:8px;align-items:flex-start}
  .num{flex:0 0 auto;width:26px;height:26px;border:1.5px solid #000;border-radius:50%;text-align:center;line-height:23px;font-family:'Tajawal';font-weight:800;font-size:11pt;margin-top:4px}
  .ptext{flex:1}
  .mark{flex:0 0 auto;border:1.5px solid #000;border-radius:5px;padding:0 6px;font-family:'Tajawal';font-weight:700;font-size:10.5pt;white-space:nowrap;margin-top:4px}
  .body{margin-top:2mm}
  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:2mm 8mm}
  .opts.four{grid-template-columns:repeat(4,1fr)}
  .opt b{font-family:'Tajawal'}
  .boxes{display:flex;gap:5mm;flex-wrap:wrap}
  .box{border:1.3px solid #000;border-radius:6px;padding:1mm 4mm}
  .bank{border:1.3px dashed #000;border-radius:6px;padding:1.5mm 4mm;margin:1mm 0 3mm;display:flex;gap:7mm;flex-wrap:wrap;justify-content:center}
  .blank{display:inline-block;min-width:32mm;border-bottom:1.3px dotted #000;height:1em}
  .lines .ln{border-bottom:1.3px dotted #000;height:8mm}
  table.grid{width:100%;border-collapse:collapse;margin:1mm 0}
  table.grid th,table.grid td{border:1.3px solid #000;padding:1mm 3mm;text-align:center;vertical-align:middle}
  table.grid th{font-family:'Tajawal';font-weight:700;background:#f0f0f0}
  table.grid td.w{height:10mm}
  .match{display:grid;grid-template-columns:1fr 18mm 1fr;align-items:center;row-gap:3mm}
  .match .a,.match .b{display:flex;align-items:center;gap:3mm}
  .match .b{justify-content:flex-start}
  .dot{width:7px;height:7px;border-radius:50%;background:#000;flex:0 0 auto}
  .seq .row{display:flex;gap:4mm;align-items:center;margin:1mm 0}
  .paren{font-family:'Tajawal';white-space:nowrap}
  .fig{position:relative;width:fit-content;max-width:62%;margin:1mm auto 2mm}
  .fig img{display:block;width:auto;height:auto;max-width:100%;max-height:95mm;filter:grayscale(1) contrast(1.1)}
  .fig .pin{position:absolute;width:22px;height:22px;margin:-11px -11px 0 0;border:1.5px solid #000;background:#fff;border-radius:50%;text-align:center;line-height:19px;font:800 10pt 'Tajawal'}
  .mm{display:flex;flex-direction:column;align-items:center;gap:2mm}
  .mm .c{border:2px solid #000;border-radius:999px;padding:1mm 8mm;font-weight:700}
  .mm .br{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4mm;width:100%}
  .mm .br div{border:1.3px solid #000;border-radius:8px;padding:1mm 2mm;text-align:center}
  .tf-row{display:flex;justify-content:space-between;gap:6mm}
  u.wrong{text-decoration-thickness:2px;text-underline-offset:5px}

  /* دليل التصحيح */
  .key table{width:100%;border-collapse:collapse;font-size:10pt;line-height:1.5}
  .key th,.key td{border:1px solid #000;padding:1.2mm 1.6mm;vertical-align:top}
  .key th{background:#eee;font-family:'Tajawal';font-weight:700;font-size:9.5pt}
  .key td.c{text-align:center;white-space:nowrap}
  .key .tot{font-family:'Tajawal';font-weight:700;margin-top:4mm;display:flex;gap:10mm}
  .key .ans{white-space:pre-line}
  .key .ktitle{font-family:'Tajawal';font-weight:800;font-size:13pt;text-decoration:underline;text-underline-offset:5px;margin:0 0 4mm}
  .key table.k5{font-size:11pt}
  .key table.k5 td{vertical-align:middle}

  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar,.side,.views,.warn,.no-print{display:none!important}
    .layout{padding:0;display:block}
    .sheet{box-shadow:none;margin:0;width:auto;min-height:auto}
    body.p-student .sheet.key{display:none}
    body.p-key .sheet.student{display:none}
  }
</style>
</head>
<body>
<div class="closed">هذه الصفحةُ قيدَ الإعدادِ وستُتاحُ قريباً بإذنِ الله.</div>

<div class="app">
  <div class="bar">
    <h1>الأوراق الورقية — العلوم · الفصل الأول</h1>
    <div class="chips" id="grades"></div>
    <span class="sep"></span>
    <div class="chips" id="kinds"></div>
  </div>
  <div class="layout">
    <aside class="side" id="list"></aside>
    <section class="main">
      <div class="views no-print" id="views" hidden>
        <button class="chip on" data-v="student">ورقة التلميذ</button>
        <button class="chip" data-v="key">دليل التصحيح</button>
        <button class="chip" data-v="both">الاثنان</button>
        <button class="print-btn" id="printBtn">طباعة</button>
      </div>
      <div class="hdrset no-print" id="hdrset" hidden>
        <label><input type="checkbox" id="hOn"> ترويسة الوزارة</label>
        <label>المحافظة <select id="hGov"></select></label>
        <label>المدرسة <input type="text" id="hSchool" maxlength="60" placeholder="مثل: وحي المعرفة الخاصة"></label>
        <small>تُحفَظ في متصفّحكِ، والفارغُ يُطبَع سطراً منقّطاً يُكتَب باليد.</small>
      </div>
      <div id="out"><div class="empty">اختر الصفّ ونوعَ الورقةِ ثمّ الدرسَ أو الوحدة.</div></div>
    </section>
  </div>
</div>

<script src="js/qpics.js?v=1"></script>
<script>
(function () {
  if (document.documentElement.classList.contains('is-closed')) return;

  var GR = { 1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع' };
  var KINDS = [
    { k: 'sq-k', label: 'أسئلة قصيرة — المعرفة والفهم', ok: function () { return true; } },
    { k: 'sq-i', label: 'أسئلة قصيرة — الاستقصاء العلمي', ok: function (g) { return g <= 2; } },
    { k: 'test', label: 'اختبار قصير', ok: function (g) { return g >= 3; } }
  ];
  var LV = { knowledge: 'معرفة', application: 'تطبيق', reasoning: 'استدلال' };
  var DF = { L: 'منخفض', M: 'متوسط', H: 'مرتفع' };
  var ST = { B: 'أحياء', C: 'كيمياء', P: 'فيزياء', E: 'استقصاء علمي' };
  var LET = ['أ', 'ب', 'ج', 'د', 'هـ'];
  var st = { grade: 0, kind: '', id: '', view: 'student' };
  var cache = {};

  var ar = function (s) { return String(s).replace(/[0-9]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'[c]; }); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var lines = function (s) { return esc(s).split('\n').map(function (l) { return '<div>' + ar(l) + '</div>'; }).join(''); };
  function rng(seed) { var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, seed) { var r = rng(seed), b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    if (b.length > 2 && b.every(function (x, i) { return x === a[i]; })) b.push(b.shift()); return b; }
  var strip = function (s) { return String(s || '').replace(/[ً-ْٰـ]/g, ''); };

  function load(g) {
    if (cache[g]) return Promise.resolve(cache[g]);
    return fetch('data/papers/sci-g' + g + '.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) { cache[g] = d; return d; });
  }

  function chips() {
    var gw = document.getElementById('grades'); gw.innerHTML = '';
    [1, 2, 3, 4].forEach(function (g) {
      var b = document.createElement('button'); b.className = 'chip' + (st.grade === g ? ' on' : ''); b.textContent = 'الصف ' + GR[g];
      b.onclick = function () { st.grade = g; st.id = ''; if (st.kind && !KINDS.filter(function (k) { return k.k === st.kind; })[0].ok(g)) st.kind = ''; if (!st.kind) st.kind = 'sq-k'; chips(); list(); };
      gw.appendChild(b);
    });
    var kw = document.getElementById('kinds'); kw.innerHTML = '';
    KINDS.forEach(function (k) {
      var b = document.createElement('button'); b.className = 'chip' + (st.kind === k.k ? ' on' : ''); b.textContent = k.label;
      b.disabled = !st.grade || !k.ok(st.grade);
      b.onclick = function () { st.kind = k.k; st.id = ''; chips(); list(); };
      kw.appendChild(b);
    });
  }

  function list() {
    var box = document.getElementById('list');
    if (!st.grade) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="empty" style="padding:16px">جارٍ التحميل…</div>';
    load(st.grade).then(function (d) {
      var h = '';
      d.units.forEach(function (u) {
        h += '<h3>الوحدة ' + ar(u.unitNo) + ': ' + esc(u.unit) + '</h3>';
        if (st.kind === 'sq-k') u.lessons.forEach(function (l) { h += btn(d, l.id + '-sq', 'الدرس ' + ar(l.lessonNo) + ': ' + esc(l.title)); });
        else h += btn(d, 'g' + st.grade + 's-' + u.unitNo + (st.kind === 'test' ? '-test' : '-inq'), st.kind === 'test' ? 'اختبار قصير — الوحدة ' + ar(u.unitNo) : 'أسئلة الاستقصاء — الوحدة ' + ar(u.unitNo));
      });
      box.innerHTML = h;
      box.querySelectorAll('.pick').forEach(function (b) { b.onclick = function () { st.id = b.dataset.id; list(); show(); }; });
    });
  }
  function btn(d, id, label) {
    var p = d.papers[id];
    if (!p) return '<button class="pick" disabled>' + label + '<small>لم تُولَّد بعد</small></button>';
    return '<button class="pick' + (st.id === id ? ' on' : '') + (p.ok ? '' : ' bad') + '" data-id="' + id + '">' + label + '<small>' + ar(p.paper.items.length) + ' مفردات · ' + ar(p.paper.total) + ' درجات</small></button>';
  }

  function show() {
    var d = cache[st.grade], rec = d && d.papers[st.id];
    var out = document.getElementById('out');
    document.getElementById('views').hidden = !rec;
    document.getElementById('hdrset').hidden = !rec;
    if (!rec) { out.innerHTML = '<div class="empty">اختر الدرسَ أو الوحدة.</div>'; return; }
    var w = rec.ok ? '' : '<div class="warn">هذه الورقةُ لم تجتزِ الفحصَ الآليَّ كاملاً: ' + esc((rec.errors || []).join(' · ')) + '</div>';
    out.innerHTML = w + student(rec, d) + keySheet(rec, d);
    applyView();
  }
  function applyView() {
    document.querySelectorAll('#views .chip').forEach(function (b) { b.classList.toggle('on', b.dataset.v === st.view); });
    var s = document.querySelector('.sheet.student'), k = document.querySelector('.sheet.key');
    if (s) s.style.display = st.view === 'key' ? 'none' : '';
    if (k) k.style.display = st.view === 'student' ? 'none' : '';
  }
  document.querySelectorAll('#views .chip').forEach(function (b) { b.onclick = function () { st.view = b.dataset.v; applyView(); }; });
  document.getElementById('printBtn').onclick = function () {
    document.body.classList.remove('p-student', 'p-key');
    if (st.view === 'student') document.body.classList.add('p-student');
    if (st.view === 'key') document.body.classList.add('p-key');
    window.print();
  };

  /* عنوانُ الورقةِ بصيغةِ النموذجِ المعتمد: «سؤال قصير (  ) معرفة وفهم في مادة العلوم للصف الأول الأساسي».
     الرقمُ بينَ القوسَين تكتبُه المعلّمة (ترتيبُ الورقةِ في الرصد)، فالمكتبةُ ورقةٌ لكلِّ درسٍ أو وحدة. */
  var DOM = { knowledge: 'معرفة وفهم', inquiry: 'استقصاء علمي' };
  function titleOf(rec) {
    var gr = 'في مادة العلوم للصف ' + GR[rec.grade] + ' الأساسي';
    return rec.kind === 'short-test' ? 'اختبار قصير (&nbsp;&nbsp;&nbsp;) ' + gr : 'سؤال قصير (&nbsp;&nbsp;&nbsp;) ' + DOM[rec.domain] + ' ' + gr;
  }
  /* ترويسةُ الوزارة: شعارُ الوزارةِ الجديد (الخنجرُ واسمُ «وزارة التعليم» — images/moe-logo.png، أرسلَه المالكُ ٢٠٢٦-١١-١١)
     ثمّ «محافظة …» و«مدرسة …». سطرا «سلطنة عمان» و«وزارة التعليم» حُذِفا لأنّ الشعارَ يحملُ اسمَ الوزارة.
     المحافظةُ والمدرسةُ يحفظُهما متصفّحُ المعلّمة (‏shoogp-papers-hdr)، والفارغُ سطرٌ منقّطٌ يُكتَبُ باليد. */
  var GOVS = ['مسقط', 'ظفار', 'مسندم', 'البريمي', 'الداخلية', 'شمال الباطنة', 'جنوب الباطنة', 'جنوب الشرقية', 'شمال الشرقية', 'الظاهرة', 'الوسطى'];
  var HK = 'shoogp-papers-hdr';
  var hdr = (function () { try { return Object.assign({ on: true, gov: '', school: '' }, JSON.parse(localStorage.getItem(HK) || '{}')); } catch (e) { return { on: true, gov: '', school: '' }; } })();
  function saveHdr() { try { localStorage.setItem(HK, JSON.stringify(hdr)); } catch (e) {} }
  var cleanSchool = function (v) { return String(v || '').replace(/\s+/g, ' ').trim().replace(/^مدرسة\s+/, ''); };
  function moe() {
    if (!hdr.on) return '';
    var gov = GOVS.indexOf(hdr.gov) >= 0 ? 'محافظة ' + esc(hdr.gov) : 'محافظة <i class="fill"></i>';
    var sc = cleanSchool(hdr.school), sch = sc ? 'مدرسة ' + esc(sc) : 'مدرسة <i class="fill"></i>';
    return '<div class="moe"><img src="images/moe-logo.png" alt="شعار وزارة التعليم">' +
      '<div class="ln2">' + gov + '</div><div class="ln2">' + sch + '</div></div>';
  }
  (function () {
    var on = document.getElementById('hOn'), gv = document.getElementById('hGov'), sc = document.getElementById('hSchool');
    gv.innerHTML = '<option value="">— اختاري —</option>' + GOVS.map(function (g) { return '<option>' + g + '</option>'; }).join('');
    on.checked = !!hdr.on; gv.value = GOVS.indexOf(hdr.gov) >= 0 ? hdr.gov : ''; sc.value = hdr.school || '';
    var sync = function () { gv.disabled = sc.disabled = !on.checked; };
    sync();
    on.onchange = function () { hdr.on = on.checked; sync(); saveHdr(); show(); };
    gv.onchange = function () { hdr.gov = gv.value; saveHdr(); show(); };
    sc.oninput = function () { hdr.school = sc.value; saveHdr(); show(); };
  })();

  function head(rec) {
    var rows = rec.kind === 'short-test' ? ['معرفة وفهم', 'استقصاء علمي'] : [DOM[rec.domain]];
    var g = '<table class="gbox"><tr><td class="lb">الدرجة</td><td></td><td></td></tr>' +
      rows.map(function (r) { return '<tr><td class="lb">' + r + '</td><td></td><td></td></tr>'; }).join('') + '</table>';
    return moe() + '<div class="phdr">' + g + '<div class="tbox">' + titleOf(rec) + '</div>' +
      '<div class="sbox"><div>الاسم :<i class="dots"></i></div><div>الصف :<i class="dots"></i></div><div>المدرسة :<i class="dots"></i></div></div></div>';
  }

  function student(rec, d) {
    var h = '<div class="sheet student">' + head(rec) +
      '<table class="items"><tr><th>المفردة</th><th>الـــــســـــؤال</th><th>الدرجة</th></tr>';
    rec.paper.items.forEach(function (it, i) { h += item(it, i, rec, d); });
    return h + '</table></div>';
  }

  function qh(i, text) { return '<div class="stem">' + lines(text) + '</div>'; }
  function pic(w) { return (window.qPic && window.qPic(w)) || ''; }
  /* بطاقةُ صورةٍ بكلمتِها؛ الكلمةُ بلا رسمٍ تبقى نصّاً (لا فراغ). */
  function pcard(w, boxed) { var im = pic(w); var c = im ? '<span class="pc">' + im + '<b>' + esc(ar(w)) + '</b></span>' : '<span>' + esc(ar(w)) + '</span>'; return boxed && im ? '<span class="pbox">' + c + '</span>' : c; }
  /* مطابقةٌ تتجاوزُ الحركات: «ضع دائرة حول» تُطابِقُ «ضَعْ دائِرَةً حَوْلَ». */
  function fuzzy(plain) { return new RegExp('^\\s*' + plain.split('').map(function (c) { return c === ' ' ? '\\s+' : c + '[\\u064B-\\u0652\\u0670\\u0640]*'; }).join(''), ''); }
  var SHADE = '(ظَلِّلْ دائِرَةَ الإجابَةِ الصَّحيحَةِ)';
  var GENERIC = [fuzzy('ضع دائرة حول رمز الإجابة الصحيحة'), fuzzy('ضع دائرة حول الإجابة الصحيحة')];
  var RAMZ = /(حَ?وْ?لَ?\s+)رَ?مْ?زِ?\s+/;
  /* تعليمةُ الاختيارِ من متعدّدٍ بصيغةِ النموذج: الدوائرُ تُظلَّل، فلا رموزَ (أ، ب) ولا «رمز الإجابة». */
  function mcqStem(p) {
    p = String(p || '');
    for (var k = 0; k < GENERIC.length; k++) {
      var m = GENERIC[k].exec(p);
      if (m) { var rest = p.slice(m[0].length).replace(/^\s*[:：،]\s*/, ''); return rest + ' ' + SHADE; }
    }
    return p.replace(RAMZ, '$1');
  }
  function bank(words, seed) { return '<div class="bank">' + shuffle(words, seed).map(function (w) { return '<span>' + esc(ar(w)) + '</span>'; }).join('') + '</div>'; }
  function wlines(n) { var s = '<div class="lines">'; for (var k = 0; k < n; k++) s += '<div class="ln"></div>'; return s + '</div>'; }

  function item(it, i, rec, d) {
    var seed = rec.id + '#' + i, m = Number(it.marks) || 1, h = '', b = '';
    switch (it.type) {
      case 'mcq': {
        /* الطولُ بلا حركات: ١٦ فأقلُّ صفٌّ واحد، و٣٠ فأقلُّ عمودان، وما زادَ عمودٌ واحد */
        var mx = Math.max.apply(null, (it.options || ['']).map(function (o) { return strip(o).length; }));
        var long = mx > 16 ? (mx <= 30 ? ' two' : ' col') : '';
        h += (it.stemPic && pic(it.stemPic) ? '<span class="spic">' + pic(it.stemPic) + '</span>' : '') + qh(i, mcqStem(it.prompt));
        if (it.pics === true) b = '<div class="popts">' + (it.options || []).map(function (o) { return '<span class="popt">' + (pic(o) ? '<span class="pc">' + pic(o) + '</span>' : '') + '<span><i class="circ"></i>' + esc(ar(o)) + '</span></span>'; }).join('') + '</div>';
        else b = '<div class="copts' + long + '">' + (it.options || []).map(function (o) { return '<span><i class="circ"></i>' + esc(ar(o)) + '</span>'; }).join('') + '</div>';
        b += '<div style="clear:both"></div>';
        break; }
      case 'tf':
        h += qh(i, 'هَلِ العِبارَةُ الآتِيَةُ صَحيحَةٌ أَمْ خاطِئَةٌ؟ (ظَلِّلِ الدّائِرَةَ)');
        b = '<div style="font-weight:700">' + esc(ar(it.statement)) + '</div><div class="copts" style="margin-top:2mm"><span><i class="circ"></i>صَحيحَةٌ</span><span><i class="circ"></i>خاطِئَةٌ</span></div>';
        break;
      case 'correct-word': {
        h += qh(i, it.prompt || 'اُكْتُبِ الكَلِمَةَ الصَّحيحَةَ مَكانَ الكَلِمَةِ الَّتي تَحْتَها خَطٌّ:', m);
        var s = String(it.sentence || ''), w = String(it.wrong || ''), at = s.indexOf(w), html;
        if (at < 0) { var words = s.split(' '); var k = words.map(strip).indexOf(strip(w)); if (k >= 0) { words[k] = '\u0001' + words[k] + '\u0002'; html = esc(words.join(' ')).replace('\u0001', '<u class="wrong">').replace('\u0002', '</u>'); } }
        else html = esc(s.slice(0, at)) + '<u class="wrong">' + esc(w) + '</u>' + esc(s.slice(at + w.length));
        b = '<div>' + ar(html || esc(s)) + '</div><div style="margin-top:2mm">الكَلِمَةُ الصَّحيحَةُ: <span class="blank"></span></div>';
        break; }
      case 'matching': {
        h += qh(i, it.prompt, m);
        var A = (it.pairs || []).map(function (p) { return p.a; }), B = (it.pairs || []).map(function (p) { return p.b; });
        if (it.extra) B.push(it.extra);
        B = shuffle(B, seed);
        var pa = it.pics === true || it.pics === 'a', pb = it.pics === true || it.pics === 'b';
        var cell = function (w, on) { var im = on && pic(w); return im ? '<span class="pch">' + im + '<b>' + esc(ar(w)) + '</b></span>' : '<span>' + esc(ar(w)) + '</span>'; };
        b = '<div class="m2"><div class="col"><div class="hd">(أ)</div>' + A.map(function (w) { return '<div class="r">' + cell(w, pa) + '<i class="dot"></i></div>'; }).join('') + '</div>' +
          '<div class="col"><div class="hd">(ب)</div>' + B.map(function (w) { return '<div class="r"><i class="dot"></i>' + cell(w, pb) + '</div>'; }).join('') + '</div></div>';
        break; }
      case 'fill': {
        h += qh(i, it.prompt, m);
        b = bank((it.answers || []).concat(it.distractors || []), seed) + '<div>' + esc(ar(it.text || '')).split('{}').join('<span class="blank"></span>') + '</div>';
        break; }
      case 'classify': {
        h += qh(i, it.prompt, m);
        var G = it.groups || [], all = [], rows = 0;
        G.forEach(function (g) { all = all.concat(g.items || []); rows = Math.max(rows, (g.items || []).length); });
        b = (it.pics === true ? '<div class="bank">' + shuffle(all, seed).map(function (w) { return pcard(w); }).join('') + '</div>' : bank(all, seed)) +
          '<table class="grid"><tr>' + G.map(function (g) { return '<th>' + esc(ar(g.name)) + '</th>'; }).join('') + '</tr>';
        for (var rr = 0; rr < rows; rr++) b += '<tr>' + G.map(function () { return '<td class="w"></td>'; }).join('') + '</tr>';
        b += '</table>';
        break; }
      case 'sequence':
        h += qh(i, it.prompt, m);
        b = '<div class="seq">' + shuffle(it.steps || [], seed).map(function (s) { return '<div class="row"><span class="paren">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span><span>' + esc(ar(s)) + '</span></div>'; }).join('') + '</div>';
        break;
      case 'exclude':
        h += qh(i, it.prompt, m);
        b = '<div class="boxes">' + (it.options || []).map(function (o) { return '<span class="box">' + (it.pics === true ? pcard(o) : esc(ar(o))) + '</span>'; }).join('') + '</div>';
        break;
      case 'label': {
        h += qh(i, it.prompt, m);
        var f = it.figure;
        if (f && f.image) {
          b = '<div class="fig"><img src="' + esc(f.image) + '" alt="">' + (f.targets || []).map(function (t, k) { var p = t.dot || t.box || { x: 50, y: 50 }; return '<span class="pin" style="right:' + (100 - p.x) + '%;top:' + p.y + '%">' + ar(k + 1) + '</span>'; }).join('') + '</div>';
          b += bank(it.answers || [], seed) + '<div class="opts">' + (f.targets || []).map(function (t, k) { return '<div>' + ar(k + 1) + ') <span class="blank"></span></div>'; }).join('') + '</div>';
        } else b = bank(it.answers || [], seed);
        break; }
      case 'mindmap': {
        h += qh(i, it.prompt, m);
        var br = it.branches || [];
        b = bank(br.map(function (x) { return x.answer; }).concat(it.distractors || []), seed) +
          '<div class="mm"><div class="c">' + esc(ar(it.center)) + '</div><div class="br" style="--n:' + br.length + '">' +
          br.map(function (x) { return '<div>' + esc(ar(x.label)) + '<br><span class="blank" style="min-width:22mm"></span></div>'; }).join('') + '</div></div>';
        break; }
      case 'short':
        h += qh(i, it.prompt, m);
        b = wlines(Math.max(Number(it.lines) || 1, (String(it.prompt).match(/\n/g) || []).length ? 2 : 1));
        break;
      case 'data-table': {
        var parts = String(it.prompt || '').split('\n');
        h += qh(i, parts[0], m);
        var t = it.table || { headers: [], rows: [] };
        b = '<table class="grid"><tr>' + (t.headers || []).map(function (x) { return '<th>' + esc(ar(x)) + '</th>'; }).join('') + '</tr>' +
          (t.rows || []).map(function (row) { return '<tr>' + row.map(function (c) { return '<td>' + esc(ar(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
        if (parts.length > 1) b += parts.slice(1).map(function (l) { return '<div>' + esc(ar(l)) + '</div>' + wlines(1); }).join('');
        else b += wlines(1);
        break; }
      case 'opinion': {
        /* سؤالُ الرأي بصيغةِ النموذج: موقفٌ ثمّ «هل توافقه الرأي؟» نعم/لا، ثمّ فسِّرْ، ويجوز اُرْسُمْ. */
        h += qh(i, String(it.scenario || '') + ' ' + String(it.question || ''));
        var sp = (it.scenePics || []).filter(function (w) { return pic(w); });
        b = (sp.length ? '<div class="scene">' + sp.map(function (w) { return '<span class="pch">' + pic(w) + '<b>' + esc(ar(w)) + '</b></span>'; }).join('') + '</div>' : '') +
          '<div class="copts"><span><i class="circ"></i>نَعَمْ</span><span><i class="circ"></i>لا</span></div>' +
          '<div class="stem" style="margin-top:2mm">' + lines(it.explain || 'فَسِّرْ إجابَتَكَ:') + '</div>' + wlines(Math.max(1, Math.min(2, Number(it.lines) || 1)));
        if (it.draw) b += '<div class="stem" style="margin-top:2mm">' + lines(it.draw) + '</div><div class="drawbox"></div>';
        break; }
      default:
        h += qh(i, it.prompt || '', m);
    }
    return '<tr class="item"><td class="n">' + ar(i + 1) + '-</td><td>' + h + '<div class="body">' + b + '</div></td><td class="m">' + (m === 2 ? 'درجتان' : 'درجة') + '</td></tr>';
  }

  /* معاييرُ التصحيح: المفردةُ ذاتُ الدرجةِ الواحدة بعبارةِ النموذج. */
  function criteria(it) {
    var g = strip(it.guidance || '').replace(/[.\s]+$/, '');
    if (Number(it.marks) === 1 && /^اجابة صحيحة\s*=\s*[1١]$/.test(g.replace(/[إأآ]/g, 'ا'))) return 'درجة في حالة الإجابة الصحيحة\nصفر في حالة الإجابة الخاطئة';
    return ar(it.guidance || '');
  }
  function answerOf(it) {
    var a = ar(String(it.answerText || '').replace(/\s*->\s*/g, ' ← '));
    if (it.type === 'tf' && typeof it.answer === 'boolean') return '● ' + (it.answer ? 'صَحيحَةٌ' : 'خاطِئَةٌ');
    return it.type === 'mcq' ? '● ' + a : a;
  }
  function keySheet(rec, d) {
    var k = 0, q = 0;
    rec.paper.items.forEach(function (it) { if (it.domain === 'inquiry') q += Number(it.marks) || 0; else k += Number(it.marks) || 0; });
    var scope = rec.kind === 'short-questions' && rec.domain === 'knowledge' ? 'الدرس: ' + esc(rec.lessons[0].title) : 'الوحدة ' + ar(rec.unitNo) + ': ' + esc(rec.unit);
    var h = '<div class="sheet key"><div class="ktitle">نموذج الإجابة — ' + titleOf(rec) + '</div><div class="meta" style="margin:-2mm 0 4mm">' + scope + '</div>';
    if (rec.kind === 'short-test') {
      /* الاختبارُ القصير: أعمدةُ دليلِ التصحيحِ كما تسمّيها الوثيقة. */
      var titles = {}; rec.lessons.forEach(function (l) { titles[l.id] = l.title; });
      h += '<table><tr><th>المفردة</th><th>فرع المادة والدرس</th><th>رقم الهدف</th><th>الهدف التعليمي</th><th>الهدف التقويمي</th><th>الصعوبة</th><th>الإجابة</th><th>الدرجة</th><th>إرشادات إضافية</th></tr>';
      rec.paper.items.forEach(function (it, i) {
        var lid = String(it.seed || '').split('#')[0], obj = String(it.objective || ''), mm = /^\s*([0-9][A-Za-z]{2,3}[0-9]+)\s*[:：]\s*(.*)$/.exec(obj);
        h += '<tr><td class="c">' + ar(i + 1) + '</td><td>' + esc(ST[it.strand] || it.strand || '') + (titles[lid] ? ' — ' + esc(titles[lid]) : '') + '</td>' +
          '<td class="c">' + esc(mm ? mm[1] : '—') + '</td><td>' + esc(mm ? mm[2] : obj) + '</td><td class="c">' + esc(LV[it.level] || it.level) + '</td>' +
          '<td class="c">' + esc(DF[it.difficulty] || it.difficulty) + '</td><td class="ans">' + esc(answerOf(it)) + '</td><td class="c">' + ar(it.marks) + '</td><td>' + esc(ar(it.guidance || '')) + '</td></tr>';
      });
      h += '</table><div class="tot"><span>المعرفة والفهم: ' + ar(k) + '</span><span>الاستقصاء العلمي: ' + ar(q) + '</span><span>المجموع: ' + ar(k + q) + '</span></div>';
    } else {
      /* السؤالُ القصير: أعمدةُ النموذجِ المعتمد — م · الدرجة · الإجابة · معايير التصحيح · الهدف المنتهي. */
      h += '<table class="k5"><tr><th>م</th><th>الدرجة</th><th>الإجابة</th><th>معايير التصحيح</th><th>الهدف المنتهي</th></tr>';
      rec.paper.items.forEach(function (it, i) {
        var obj = String(it.objective || '').replace(/^\s*([0-9][A-Za-z]{2,3}[0-9]+)\s*[:：]\s*/, '$1 ');
        h += '<tr><td class="c">' + ar(i + 1) + '</td><td class="c">' + ar(it.marks) + '</td><td class="ans">' + esc(answerOf(it)) + '</td><td class="ans">' + esc(criteria(it)) + '</td><td>' + esc(obj) + '</td></tr>';
      });
      h += '</table><div class="tot"><span>المجموع: ' + ar(k + q) + '</span></div>';
    }
    return h + '</div>';
  }

  chips();
})();
</script>
</body>
</html>
