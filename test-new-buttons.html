<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة عناصر الواجهة المصوّرة — الطيور المُدهشة</title>
<!--
  ⚠️ صفحة تجريبية منفصلة — ستايل المنصّة الحالي حرفياً (نفس css/style.css
  وjs/app.js وrocket.js قراءةً دون تعديل)، والتغيير الوحيد: استبدال عناصر
  الواجهة بصور images/ui/ الجاهزة:
  تحقّق (btn-check) · إعادة (btn-retry)
  التنقل: btn-next-prev.png مرتين — السابق بالأصل (سهم يمين = رجوع)
  والتالي معكوس scaleX(-1) (سهم يسار = تقدّم في واجهة عربية) والنص حيّ لا يُعكس
  شارة رقم السؤال ومؤشر التقدّم (badge-qnum — progress-pill.png غير موجود بعد)
  شارة نوع السؤال (badge-qtype) · بطاقات الكلمات (word-card).
  حاوية الإجابة وفراغات الإسقاط تبقى CSS كما هي (تتمدد حسب المحتوى).
  (الصور المشطرنجة الأصل نُظّفت برمجياً في مكانها بالأسماء المعتمدة نفسها.)
  تفتح درس «الطيور المُدهشة» تلقائياً. كل الوظائف (سحب/تحقق/تنقل/أصوات) من app.js كما هي.
-->
<link rel="stylesheet" href="css/style.css">
<style>
/* ═══════════ العناصر المصوّرة فقط — البقية ستايل المنصّة دون مساس ═══════════
   نِسَب الأبعاد محفوظة دائماً: بُعد واحد + aspect-ratio للأزرار،
   وborder-image (تقنية 9-slice) للكبسولات والبطاقات: الأطراف ثابتة والوسط يتمدد. */

/* تنعيم الحواف: بلا pixelated، وظلّ إسقاط خفيف جداً بدل أي border */
.actions .btn-check, .actions .btn-reset, .qnav .nav-btn img,
.qcard .qnum, .qcard .qtype, .qprogress, .chip{image-rendering:auto}

/* محاذاة تحقّق/إعادة على خط منتصف رأسي واحد + تباعد ٤٨px */
.actions{align-items:center; gap:48px}

/* ① زر تحقّق: نجمة خضراء + النص الحالي فوقها (٦٥٪ — الارتفاع فقط والعرض تلقائي) */
.actions .btn-check,
.actions .btn-check:hover{
  background:url('images/ui/btn-check.png') no-repeat center / contain !important;
  border:none !important; box-shadow:none !important; border-radius:0;
  height:84px; aspect-ratio:842/816; width:auto; padding:9px 0 0 !important; min-width:0;
  color:#fff; font-weight:800; font-size:.96rem;
  text-shadow:0 2px 4px rgba(25,90,15,.8), 0 0 8px rgba(25,90,15,.45);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.22));
  transition:transform .18s, filter .2s;
}
.actions .btn-check:hover{
  transform:translateY(-3px) scale(1.06);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.22)) drop-shadow(0 0 12px rgba(150,225,90,.8));
}
.actions .btn-check:active{transform:scale(.94)}

/* ② زر إعادة: كوكب أزرق بسهم دوران + النص الحالي فوقه (٦٥٪) */
.actions .btn-reset,
.actions .btn-reset:hover{
  background:url('images/ui/btn-retry.png') no-repeat center / contain !important;
  border:none !important; box-shadow:none !important; border-radius:0;
  height:74px; aspect-ratio:1056/785; width:auto; padding:0 22px 0 0 !important; min-width:0;
  color:#fff; font-weight:800; font-size:.94rem;
  text-shadow:0 2px 4px rgba(0,45,85,.85), 0 0 8px rgba(0,45,85,.5);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.22));
  transition:transform .18s, filter .2s;
}
.actions .btn-reset:hover{
  transform:translateY(-3px) scale(1.06);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.22)) drop-shadow(0 0 12px rgba(255,190,80,.75));
}
.actions .btn-reset:active{transform:scale(.94)}

/* ③+④ التنقل (٧٥٪): btn-next-prev.png مرتين — السابق بالاتجاه الأصلي
   (سهمه يمين: رجوع)، والتالي بنفس الصورة معكوسة scaleX(-1) (سهمه يسار:
   تقدّم في الواجهة العربية، يطابق «→ السابق» و«التالي ←» الأصلية).
   الصورة تحدد عرض الزرّ (height ثابت وwidth تلقائي فلا شدّ عرضياً)،
   والنصان حيّان في <span> منفصل فلا يُعكسان مع الصورة (يحقنهما السكربت أدناه) */
.qnav .nav-btn,
.qnav .nav-btn:hover:not(:disabled){
  position:relative; background:none !important; border:none !important;
  box-shadow:none !important; height:66px; width:auto; padding:0; min-width:0;
  transition:transform .18s, filter .2s;
}
.qnav .nav-btn img{
  display:block; height:100%; width:auto; object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.qnav .nav-next img{transform:scaleX(-1)}
.qnav .nav-btn .ncap{
  position:absolute; top:50%; transform:translateY(-53%);
  text-align:center; color:#fff; font-weight:800; font-size:1rem;
  pointer-events:none; font-family:'Tajawal',sans-serif;
  text-shadow:0 2px 4px rgba(150,70,5,.85), 0 0 8px rgba(150,70,5,.4);
}
.qnav .nav-prev .ncap{left:12px; right:46px}   /* السهم في يمين الصورة الأصلية */
.qnav .nav-next .ncap{left:46px; right:12px}   /* وبعد العكس في يسارها */
.qnav .nav-btn:hover:not(:disabled){
  transform:translateY(-3px) scale(1.05);
  filter:drop-shadow(0 0 13px rgba(255,165,60,.8));
}
.qnav .nav-btn:active:not(:disabled){transform:scale(.95)}
.qnav .nav-btn:disabled{opacity:.35}

/* ⑤ شارة رقم السؤال: الصورة كما هي بلا أي معالجة — ارتفاع ثابت والعرض من
   نسبة الأبعاد الأصلية (2508:627) بلا شد، والنص الحيّ متوسط فوقها */
.qcard .qnum{
  display:inline-flex; align-items:center; justify-content:center;
  height:46px; aspect-ratio:2096/534; width:auto; padding:0;
  background:url('images/ui/badge-qnum.png') no-repeat center / contain;
  color:#ffe27a; font-weight:800; font-size:1.14rem;
  text-shadow:0 2px 3px rgba(0,40,70,.75);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));
}

/* ⑥ شارة نوع السؤال: الصورة كما هي بلا معالجة إضافية — ارتفاع ثابت والعرض من
   نسبتها الأصلية (1657:511) بلا شد، والنص الحيّ متوسط في جسم الكبسولة
   (إزاحة يسارية بسيطة كي لا يزاحم زخرفة النجمة والكوكب في طرفها) */
.qcard .qtype{
  display:inline-flex; align-items:center; justify-content:center;
  height:54px; aspect-ratio:1657/511; width:auto; padding:0 8px 0 36px;
  white-space:nowrap;
  background:url('images/ui/badge-qtype.png') no-repeat center / contain;
  color:#fff; font-weight:800; font-size:.9rem;
  text-shadow:0 2px 3px rgba(0,40,70,.75);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));
}
.qhead{margin-bottom:10px}

/* ⑦ مؤشر التقدّم (٧٥٪): نفس كبسولة الرقم 9-slice (progress-pill.png غير متوفر بعد) */
.qprogress{
  display:inline-flex; align-items:center; justify-content:center;
  height:42px; aspect-ratio:2096/534; width:auto; padding:0;
  background:url('images/ui/badge-qnum.png') no-repeat center / contain;
  color:#fff; font-weight:800; font-size:.98rem;
  text-shadow:0 2px 3px rgba(0,40,70,.75);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.22));
  margin-inline:auto;
}

/* ⑧ بطاقات الكلمات: word-card بتقنية 9-slice — العرض يتبع طول الكلمة
   (width:fit-content + حدّ أدنى موحّد) والزوايا والنجمة لا تتشوهان أبداً.
   السحب والإفلات كما هو؛ حالتا ok/no بتوهّج وعلامة بدل تغيير لون الخلفية */
.chip{
  width:fit-content; min-width:112px; min-height:52px;
  display:inline-flex; align-items:center; justify-content:center;
  background:none !important;
  border-style:solid; border-color:transparent; border-width:15px 29px !important;
  border-image:url('images/ui/word-card.png') 226 434 fill stretch !important;
  box-shadow:none !important; border-radius:16px;
  padding:2px 0 4px !important;
  color:#274a63 !important; font-weight:800; font-size:1rem;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));
  transition:transform .15s, filter .15s;
}
.chip:hover{transform:scale(1.05)}
.chip:active{transform:scale(.97)}
.chip.dragging{transform:scale(1.08); filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.chip.ok{
  color:#20340a !important;
  filter:drop-shadow(0 0 5px rgba(130,200,70,.95)) drop-shadow(0 0 10px rgba(130,200,70,.7)) !important;
}
.chip.ok::before{content:"✓ "; color:#3e9142; font-weight:900}
.chip.no{
  color:#c94a4a !important;
  filter:drop-shadow(0 0 5px rgba(224,82,82,.95)) drop-shadow(0 0 10px rgba(224,82,82,.6)) !important;
}
.chip.no::before{content:"✗ "; color:#c94a4a; font-weight:900}
/* .chip.used تبقى كما هي (شفافية + شطب) — تعمل فوق الصورة */

/* ⑨ حاوية الإجابة وفراغات الإسقاط (.blank .target .grp-drop): CSS المنصّة كما هو — بلا صور */

/* ⑩ تجربة: صورة الإطار frame-moon-source.png كما هي حاويةً كاملة للسؤال.
   الإطار صندوق بنسبة أبعاد الصورة الأصلية بالضبط (1448:1086) بلا أي شد،
   والمحتوى في نافذة داخلية فوق منطقة وسط الإطار مع تمرير داخلي عند الطول —
   الإطار نفسه لا يتمدد. الشارتان تبقيان فوقه من الخارج. */
.qcard{
  background:none !important;
  border:none !important;
  box-shadow:none !important;
  border-radius:0;
  overflow:visible;
  padding:0 !important;
  color:#fff;
}
.qcard::before,.qcard::after{display:none}
.qcard .qhead{padding:0 10px; margin-bottom:14px}
/* عائلة الإطارات القمرية: صنف الحجم (qf-s/qf-m/qf-l) والهندسة تُضبط من
   جدول FRAME_SIZES في السكربت — الإطار بنسبة صورته الأصلية دائماً بلا شد،
   والعرض يتناسب مع الشاشة ويُقيَّد بالارتفاع المتاح */
.qframe{
  position:relative;
  margin-inline:auto;
  background:none;
  /* إعادة ضبط المقاس بانتقال سلس لا قفزة (يُدار من fitFrame: يُعطَّل أثناء
     القياس ويُفعَّل للتغيّر النهائي فقط، حتى لا يفسد قياس الأبعاد المتزامن) */
  transition:width .30s ease;
}
/* ضمان بقاء أزرار تحقّق/إعادة فوق كل الطبقات داخل النافذة (فوق صورة الإطار) */
.qwin .actions{position:relative; z-index:5}
/* تلاشٍ قصير عند التنقل بين سؤالين (يمنع قفزة تغيّر حجم الإطار) */
.qcard{animation:cardFade .28s ease}
@keyframes cardFade{from{opacity:0}to{opacity:1}}

/* ثلاث طبقات فوق خلفية الصفحة:
   (0) .qfill  — التعبئة النقطية، خلف الإطار، تُرى من الفتحة الشفافة فقط
   (1) .qmoon  — صورة الإطار القمري بحوافه وحفره وزخارفه، تغطّي حواف التعبئة
   (2) .qwin   — محتوى السؤال، فوق الجميع */

/* التعبئة الداخلية (CSS خالص — الصور لم تُمسّ): قماشة الحاوية القديمة نفسها —
   تعبئة بيضاء شبه شفافة (alpha 0.3 = شفافية 70%) وفوقها شبكة النقاط المنسوخة
   حرفياً من .qcard::after في css/style.css (نقطة 1.3px بشفافية .17، شبكة
   22×22px، إزاحة 6px). إزاحاتها = نصف إزاحات الفتحة، فتمتدّ تحت حافة الإطار
   الداخلية (تداخل يمنع أي خط فاصل أو فجوة)، وزواياها مستديرة كبيرة تقارب
   انحناء الفتحة. مربوطة نسبياً فتلاحق كل تكبير وتصغير، والنقاط ثابتة الحجم. */
.qfill{
  position:absolute; z-index:0;
  background-color:rgba(43,87,72,.65);     /* أخضر #2B5748 بشفافية 65% — لكل الأسئلة */
  box-shadow:inset 0 0 10px rgba(0,0,0,1); /* ظل داخلي أسود واضح، انتشار 10px */
  background-image:radial-gradient(rgba(255,255,255,.17) 1.3px, transparent 1.7px);
  background-size:22px 22px;
  background-position:6px 6px;
  border-radius:8%/7%;
  backdrop-filter:blur(6px) saturate(.9);
  -webkit-backdrop-filter:blur(6px) saturate(.9);
  pointer-events:none;
}
/* صورة الإطار القمري فوق التعبئة (تُحقن عبر متغيّر --fimg) */
.qmoon{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:var(--fimg) no-repeat center / contain;
}
/* نافذة المحتوى فوق الجميع — إزاحاتها من جدول المقاسات (متحفظة عن الزخارف) */
.qwin{
  --s:1;   /* الخطوط بأحجامها الافتراضية — الإطار هو الذي يتكيف، لا تمرير أبداً */
  position:absolute; z-index:2;
  overflow:hidden;
  padding:10px 16px;
  display:flex; flex-direction:column;
  justify-content:space-evenly;   /* القليل يتباعد باسترخاء */
  row-gap:10px;
  color:#3d2f14;
}
/* الملاذ الأخير: حاوية CSS مرنة بروح العائلة (حد ودرجات كريمية قمرية +
   طبقة الشفافية) تتمدد مع المحتوى — للسؤال الذي يتجاوز سقف تكبير الإطار l */
/* الملاذ المرن = إطار قمري مطاطي (9-slice من رسم l): الزوايا وزخارفها
   (الكوكب، الفوهات) بنسبها الأصلية ثابتة، والأشرطة الوسطى وحدها تتمدد
   رأسياً بقدر المحتوى — فيبقى الشكل القمري معمّماً على كل الأسئلة */
.qframe.qflex{
  width:min(100%, 880px) !important;
  aspect-ratio:auto !important;
  background:none !important;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.3));
  padding:6px 2px 10px;
}
/* في المرن: صورة الإطار 9-slice على طبقة .qmoon (بلا fill فيبقى الوسط شفافاً
   وتظهر التعبئة خلفه)، والأشرطة الوسطى وحدها تتمدد رأسياً */
.qframe.qflex .qmoon{
  inset:0; background:none;
  border-style:solid; border-color:transparent;
  border-width:100px 110px 115px 110px;
  border-image:url('images/ui/frame-moon-l.png') 218 240 250 240 stretch;
}
.qframe.qflex .qfill{display:block; inset:26px !important; border-radius:26px}
.qframe.qflex .qwin{
  position:relative; z-index:2; overflow:visible; height:auto;
  top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
}
.qwin>*{width:100%; flex:0 0 auto}

/* التقليص التدريجي بحدود دنيا صارمة:
   نص السؤال ≥22px · الخيارات والبطاقات ≥18px · العنصر التفاعلي ≥60px */
.qwin .qprompt{font-size:max(22px, calc(26px * var(--s))) !important}
.qwin .tf,.qwin .opt{
  font-size:max(18px, calc(21px * var(--s))) !important;
  min-height:60px;
}
.qwin .mitem,.qwin .seqitem,.qwin .excl-opt,.qwin .aopt{
  font-size:max(18px, calc(20px * var(--s))) !important;
  min-height:60px; display:flex; align-items:center; justify-content:center;
}
.qwin .chip{
  font-size:max(18px, calc(19px * var(--s))) !important;
  min-height:60px;
}
.qwin .fbtext{font-size:max(18px, calc(21px * var(--s))) !important}
.qwin .grp-h{font-size:max(18px, calc(19px * var(--s))) !important}
.qwin .grp-drop{min-height:max(60px, calc(110px * var(--s)))}
.qwin::-webkit-scrollbar{width:10px}
.qwin::-webkit-scrollbar-thumb{background:#d9be93; border-radius:5px}
.qwin::-webkit-scrollbar-track{background:rgba(120,90,40,.08); border-radius:5px}
/* نصوص فاتحة فوق طبقة التعبئة الكحلية الداكنة (النصوص العارية فقط —
   الخيارات والبطاقات لها خلفية كريمية بنصّها الداكن فتبقى كما هي) */
.qwin{color:#eef1f6}
.qwin>.qprompt{margin:4px 0 14px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.qwin .qfb.good{color:#a8e6bd !important;text-shadow:0 1px 2px rgba(0,0,0,.4) !important}
.qwin .qfb.bad{color:#ffb3aa !important;text-shadow:0 1px 2px rgba(0,0,0,.4) !important}
.qwin .bank .bt{color:#e7ecf3 !important}
.qwin .seq-hint{color:#dfe4ee !important}
.qwin .grp{border-color:#d9b97c !important}
.qwin .grp-h{background:#e6cd9c !important;color:#4a3213 !important;text-shadow:none !important}

/* ═══════════════════════════════════════════════════════════════════
   ★ ستايل البطاقات الزجاجية الزرقاء (CSS خالص، بلا صور) ★
   يُطبَّق على: بطاقات التوصيل (.mitem) · خيارات الاختيار (.opt) ·
   بطاقات الكلمات القابلة للسحب (.chip في التصنيف وملء الفراغ).
   لا يمسّ الأزرار المصوّرة (تحقّق/إعادة/التنقل/الشارات).
   ─ خلفية زرقاء بتدرّج رأسي (أفتح أعلى، أغمق أسفل) + لمعة زجاجية علوية
   ─ حدّ أزرق أغمق سميك + زوايا كبيرة + نجيمتان بيضاوان في الزاويتين العلويتين
   ─ نص كحليّ داكن غامق متوسط · ظل خفيف للبروز
   ═══════════════════════════════════════════════════════════════════ */
.qwin .opt, .qwin .mitem, .qwin .chip{
  /* نجمة/بريق أبيض صغير (رباعي الأطراف) للزخرفة في الزاويتين */
  --spk:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 0C8.7 4.6 11.4 7.3 16 8 11.4 8.7 8.7 11.4 8 16 7.3 11.4 4.6 8.7 0 8 4.6 7.3 7.3 4.6 8 0Z' fill='white'/></svg>");
  /* التدرّج الأساسي: سماوي فاتح أعلى ← أزرق أغمق أسفل (درجات الصورة) */
  --card-grad:linear-gradient(180deg,#d4edfb 0%,#a8d6f2 52%,#82bfe8 100%);
  /* اللمعة الزجاجية: شريط أبيض شبه شفّاف يعلو النصف الأعلى ثم يتلاشى */
  --card-sheen:linear-gradient(180deg,rgba(255,255,255,.60) 0%,rgba(255,255,255,.18) 40%,rgba(255,255,255,0) 56%);
  background:
    var(--spk) top 7px right 10px / 13px 13px no-repeat,
    var(--spk) top 8px left  10px / 9px  9px  no-repeat,
    var(--card-sheen),
    var(--card-grad) !important;
  border:2.5px solid #3d86bd !important;
  border-image:none !important;          /* يلغي إطار word-card.png المصوّر */
  border-radius:17px !important;
  box-shadow:0 4px 9px rgba(23,66,102,.30), inset 0 1px 0 rgba(255,255,255,.55) !important;
  color:#143247 !important;              /* نص كحليّ داكن */
  font-weight:800 !important;
  text-shadow:none !important;
  filter:none !important;                /* يلغي drop-shadow صور البطاقة القديمة */
  min-height:60px;                       /* حد أدنى للمس */
  transition:transform .16s ease, box-shadow .18s ease, filter .18s ease !important;
}
/* بطاقات الكلمات: حشوة مريحة وتوسيط (كانت تعتمد على أبعاد الصورة) */
.qwin .chip{
  padding:12px 20px !important;
  display:inline-flex; align-items:center; justify-content:center;
}
.qwin .chip.ok::before, .qwin .chip.no::before{content:none}  /* بلا علامات نصية — نكتفي باللون */

/* ⟡ تحويم/لمس: تفتيح طفيف مع رفع بسيط */
.qwin .opt:hover:not(:disabled),
.qwin .mitem:not(.matched):hover,
.qwin .chip:not(.used):hover{
  filter:brightness(1.06) !important;
  transform:translateY(-2px);
}
.qwin .opt:active:not(:disabled),
.qwin .mitem:not(.matched):active,
.qwin .chip:not(.used):active{transform:translateY(0) scale(.98)}
.qwin .chip.dragging{
  transform:scale(1.07) !important;
  box-shadow:0 10px 20px rgba(23,66,102,.42) !important;
  filter:none !important;
}

/* ⟡ حالة «محدّدة» (التوصيل): توهّج أزرق حول الحد */
.qwin .mitem.selected{
  border-color:#2f79b5 !important;
  box-shadow:0 0 0 3px rgba(125,198,242,.80),
             0 0 16px rgba(85,170,235,.80),
             0 4px 10px rgba(23,66,102,.32) !important;
  transform:translateY(-1px);
}

/* ⟡ بعد التحقّق — الصحيحة: تدرّج أخضر بنفس الأسلوب (نبدّل التدرّج فقط
   فتبقى اللمعة والنجيمتان) */
.qwin .opt.correct,
.qwin .mitem.matched,
.qwin .chip.ok{
  --card-grad:linear-gradient(180deg,#ddf4c8 0%,#aee08a 52%,#8ccf66 100%);
  border-color:#5fa23f !important;
  color:#22380b !important;
  box-shadow:0 4px 9px rgba(40,80,20,.28),
             0 0 12px rgba(140,205,95,.55),
             inset 0 1px 0 rgba(255,255,255,.45) !important;
}

/* ⟡ بعد التحقّق — الخاطئة: اهتزاز لطيف مع بقاء البطاقة على حالها العادية
   (لا لون عقابيّ صارخ — نلغي أي خلفية وردية يفرضها المنطق) */
.qwin .opt.wrong,
.qwin .chip.no,
.qwin .mitem.shake{animation:cardShake .45s ease}
@keyframes cardShake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-5px)} 30%{transform:translateX(5px)}
  45%{transform:translateX(-4px)} 60%{transform:translateX(4px)}
  75%{transform:translateX(-2px)} 90%{transform:translateX(2px)}
}
@media(prefers-reduced-motion:reduce){
  .qwin .opt.wrong,.qwin .chip.no,.qwin .mitem.shake{animation:none}
}

/* ═══════════ إصلاح المطّ في أسئلة البطاقات (التصنيف/السحب) ═══════════
   الإطار سليم (نسبة أبعاده محفوظة)؛ المطّ كان من align-items الافتراضي (stretch):
   الصناديق الفارغة تنتفخ لتطابق أطول صندوق، والبطاقات تتمدّد رأسياً لتطابق
   أطول بطاقة في صفّها. الحل: محاذاة البداية فيأخذ كلٌّ ارتفاع محتواه فقط. */
/* ④ صناديق التصنيف: كلٌّ بارتفاع محتواه — الفارغ لا يُمطّ ليطابق الأطول */
.qwin .grp-row{align-items:flex-start}
/* ③ البطاقات: ارتفاعها مع نصّها فقط (سطر/سطران) لا مع أطول بطاقة في الصف،
   وحدّ أقصى مريح للعرض فتلتفّ الكلمة الطويلة بدل أن تتمدّد عرضاً */
.qwin .grp-drop,
.qwin .clsbank .chips,
.qwin .fillbank .chips{align-items:flex-start}
.qwin .chip{max-width:min(100%,340px)}
/* ② صورة «السحب على صورة»: object-fit:contain احترازاً ضد أي شدّ */
.qwin img.labelimg{object-fit:contain}

/* ═══════════ تمييز السحب/الإفلات (تربوي): المحمول ≠ المستقبِل ═══════════
   الطفل يميّز فوراً: البطاقة الزرقاء «ترتفع» عن السطح (تُحمَل)، والفراغ «غائر»
   كالحفرة (يستقبِل). أثناء السحب يتوهّج الفراغ الصالح ترحيباً، وبعد الإفلات
   يمتلئ الفراغ ببطاقة زرقاء ليفهم أنّ المكان اكتمل. */
.qwin .blank, .qwin .target{
  --spk:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 0C8.7 4.6 11.4 7.3 16 8 11.4 8.7 8.7 11.4 8 16 7.3 11.4 4.6 8.7 0 8 4.6 7.3 7.3 4.6 8 0Z' fill='white'/></svg>");
}

/* ① بطاقات السحب: بروز أوضح (ظل أعمق) وتوهّج عند اللمس يوحي بالارتفاع عن السطح */
.qwin .chip{
  box-shadow:0 6px 13px rgba(23,66,102,.40), inset 0 1px 0 rgba(255,255,255,.55) !important;
}
.qwin .chip:not(.used):hover{
  box-shadow:0 10px 18px rgba(23,66,102,.44), 0 0 14px rgba(120,195,240,.70),
             inset 0 1px 0 rgba(255,255,255,.60) !important;
  transform:translateY(-3px);
}
.qwin .chip:not(.used):active, .qwin .chip.dragging{
  cursor:grabbing;
  box-shadow:0 14px 26px rgba(23,66,102,.50), 0 0 20px rgba(120,195,240,.90),
             inset 0 1px 0 rgba(255,255,255,.60) !important;
  transform:translateY(-4px) scale(1.06) !important;
}

/* ② فراغات الإسقاط الفارغة: غائرة كالحفرة — أغمق قليلاً من محيطها، حد متقطّع
   واضح، ظل داخليّ، بلا أيّ لمعة أو بروز */
.qwin .blank{
  background:rgba(30,45,38,.12) !important;
  border:2px dashed #9fb0a6 !important; border-radius:12px !important;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.22) !important;
  color:#8a998f !important; text-shadow:none !important; font-weight:800;
}
.qwin .target{
  background:rgba(20,36,29,.32) !important;
  border:2px dashed rgba(255,255,255,.80) !important; border-radius:12px !important;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.42) !important;
  color:#eef3ef !important; text-shadow:0 1px 2px rgba(0,0,0,.45) !important;
}

/* ④ بعد الإفلات: يستقرّ كبطاقة زرقاء ممتلئة (نفس أسلوب البطاقات) — المكان اكتمل،
   ويبقى قابلاً للسحب/الإخراج للتصحيح (منطق التفريغ قائم في المحرّك) */
.qwin .blank.filled, .qwin .target.filled{
  background:
    var(--spk) top 5px right 7px/11px 11px no-repeat,
    var(--spk) top 6px left  7px/8px  8px  no-repeat,
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.16) 40%,rgba(255,255,255,0) 56%),
    linear-gradient(180deg,#d4edfb 0%,#a8d6f2 52%,#82bfe8 100%) !important;
  border:2.5px solid #3d86bd !important; border-style:solid !important; border-radius:13px !important;
  box-shadow:0 4px 9px rgba(23,66,102,.30), inset 0 1px 0 rgba(255,255,255,.55) !important;
  color:#143247 !important; text-shadow:none !important; font-weight:800 !important; cursor:grab;
}
/* الصحيحة بعد التحقّق: بطاقة خضراء بنفس الأسلوب */
.qwin .blank.filled.correct, .qwin .target.filled.correct, .qwin .blank.correct{
  background:
    var(--spk) top 5px right 7px/11px 11px no-repeat,
    var(--spk) top 6px left  7px/8px  8px  no-repeat,
    linear-gradient(180deg,rgba(255,255,255,.50) 0%,rgba(255,255,255,.14) 40%,rgba(255,255,255,0) 56%),
    linear-gradient(180deg,#ddf4c8 0%,#aee08a 52%,#8ccf66 100%) !important;
  border-color:#5fa23f !important; color:#22380b !important;
  box-shadow:0 4px 9px rgba(40,80,20,.28), 0 0 12px rgba(140,205,95,.50),
             inset 0 1px 0 rgba(255,255,255,.45) !important;
}
/* الخاطئة: تبقى زرقاء (لا لون عقابيّ) مع اهتزاز لطيف */
.qwin .blank.wrong, .qwin .target.wrong{animation:cardShake .45s ease}

/* ③ أثناء السحب فوق فراغ صالح: توهّج مرحّب (أخضر فاتح) يقول «أفلت هنا»
   — يأتي أخيراً ليَغلِب كلّ الحالات أثناء التحويم */
.qwin .blank.over, .qwin .target.over{
  background:rgba(95,191,106,.32) !important;
  border:2px dashed #5fbf6a !important;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.10),
             0 0 0 3px rgba(95,191,106,.45),
             0 0 16px rgba(95,191,106,.65) !important;
  color:#1f4a26 !important; text-shadow:none !important;
}

/* شارة الصفحة التجريبية */
.test-badge{
  position:fixed; top:12px; left:12px; z-index:99;
  background:rgba(255,120,60,.92); color:#fff; font-weight:800; font-size:.82rem;
  border-radius:999px; padding:6px 15px;
  box-shadow:0 3px 10px rgba(0,0,0,.3);
  font-family:'Tajawal',sans-serif;
}
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="app">
    <header>

    <section class="screen" id="activityScreen">

<script src="js/data.js"></script>

<script src="js/app.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   حقن صور التنقل بعد أن يبني app.js الأزرار:
   الصورة <img> داخل الزرّ (التالي معكوس scaleX(-1) عبر CSS أعلاه)
   والنصّ الحيّ في <span class="ncap"> منفصل فلا يُعكس معها.
   معالجات النقر على الزرّ نفسه فتبقى سليمة.
   بقية العناصر (تحقّق/إعادة/الشارات/المؤشر/البطاقات) صور خلفية CSS خالصة.
   ═══════════════════════════════════════════════════════ */
/* ═══════════ عائلة الإطارات القمرية — خوارزمية «اختيار ثم ضبط» ═══════════
   لا تمرير داخلياً أبداً. لكل سؤال:
   (١) الاختيار: نقيس ارتفاع محتواه الفعلي (بالخطوط الدنيا: السؤال 22px،
       العناصر 18px، التفاعلي 60px) داخل نافذة كل إطار عند حجمه الأساسي،
       فنحسب kNeed = المطلوب/المتاح. الإطار المختار = الأصغر الذي يسع المحتوى
       ضمن سقف التكبير (أكبر kNeed ≤ 1.30) = الأقرب سعةً بأقلّ هدر.
   (٢) الضبط: نكبّر/نصغّر الإطار كاملاً بمقياس موحّد (النسبة محفوظة، بلا شد)
       حتى تسع نافذته المحتوى بالضبط.
   القيود: تكبير ≤ +30% · تصغير ≥ −25% · الإطار ≤ 92% من المساحة الرأسية.
   إن عجز l حتى عند +30% → حاوية CSS مرنة (qflex) بروح العائلة، بلا تمرير.
   FRAME_SIZES: هندسة كل مقاس (الصورة، النسبة، إزاحات الفتحة المتحفظة). */
var FRAME_SIZES={
  s:{img:'images/ui/frame-moon-s.png', ar:'1859 / 788',
     win:{top:'13%',   left:'8.5%',  right:'9%',    bottom:'14.5%'}},
  m:{img:'images/ui/frame-moon-m.png', ar:'1445 / 1055',
     win:{top:'10%',   left:'9.5%',  right:'9.5%',  bottom:'11%'}},
  l:{img:'images/ui/frame-moon-l.png', ar:'1246 / 1222',
     win:{top:'10.5%', left:'12.5%', right:'11.5%', bottom:'11.5%'}}
};
var FRAME_ORDER=['s','m','l'];
var BASE_FILL=0.70;   /* حجم مقياس 1: ارتفاع الإطار = 70% من المساحة المتاحة */
var CAP_UP=1.30, CAP_DOWN=0.75, OUTER=0.92;
var DEV=true;         /* تقرير تطويري في الطرفية عن دقّة الحساب المسبق */

function frameAR(cfg){          /* الارتفاع÷العرض (لاشتقاق ارتفاع من عرض) */
  if(!cfg._r){ var p=cfg.ar.split('/'); cfg._r=parseFloat(p[1])/parseFloat(p[0]); }
  return cfg._r;
}
function availHeight(){ return Math.max(380, window.innerHeight*0.80); }

/* لفّ محتوى كل بطاقة (عدا الشارتين) داخل هيكل الإطار (طبقة .qfill الشبه شفافة
   ثم نافذة .qwin) — بمقاس مبدئي محايد؛ fitFrame() هو من يختار المقاس ويضبطه */
function frameize(){
  document.querySelectorAll('.qcard:not([data-frame])').forEach(function(c){
    c.dataset.frame='1';
    var head=c.querySelector('.qhead');
    var f=document.createElement('div'); f.className='qframe qf-m';
    var fill=document.createElement('div'); fill.className='qfill';
    var moon=document.createElement('div'); moon.className='qmoon';
    var w=document.createElement('div'); w.className='qwin';
    f.appendChild(fill); f.appendChild(moon); f.appendChild(w);
    Array.prototype.slice.call(c.children).forEach(function(ch){
      if(ch!==head) w.appendChild(ch);
    });
    c.appendChild(f);
  });
}
/* يضبط صورة الإطار (في متغيّر --fimg لطبقة .qmoon) ونسبته وإزاحات فتحته لمقاس.
   إزاحات التعبئة = نصف إزاحات الفتحة → تمتدّ تحت حافة الإطار (تداخل بلا فجوة) */
function applyFrame(f,fill,w,size){
  var cfg=FRAME_SIZES[size];
  f.style.setProperty('--fimg',"url('"+cfg.img+"')");
  f.style.aspectRatio=cfg.ar;
  ['top','left','right','bottom'].forEach(function(k){
    w.style[k]=cfg.win[k];
    fill.style[k]=(parseFloat(cfg.win[k])*0.5).toFixed(2)+'%';
  });
  return cfg;
}
/* يبني الإطار بعرض Wf ويعيد هل يسع محتواه (بلا فائض) */
function frameFits(f,fill,w,size,Wf){
  applyFrame(f,fill,w,size);
  f.className='qframe qf-'+size;
  f.style.width=Wf+'px';
  return w.scrollHeight<=w.clientHeight+2;   /* قراءة تفرض التخطيط */
}
/* الملاذ الأخير: حاوية مرنة بروح العائلة، بلا تمرير */
function toFlex(f,fill,w,base){
  applyFrame(f,fill,w,base);
  f.className='qframe qf-'+base+' qflex';
  f.style.width=''; f.style.aspectRatio='';
}
/* البطاقة الظاهرة حالياً (غير المخفيّة) */
function currentShown(){
  return Array.prototype.find.call(document.querySelectorAll('.qcard'),
    function(k){return k.style.display!=='none';});
}
/* ═══ الحساب المسبق بأسوأ الحالات (للأنواع ذات المحتوى المتحرّك) ═══
   بدل قياس المحتوى في حالته الابتدائية، نُرتّبه مؤقتاً في حالة *التوزيع النهائي
   الأقصى* فيُقاس الارتفاع الأكبر ويُختار الإطار له من اللحظة الأولى، فلا يتمدّد
   أثناء إجابة الطالب. نُعيد كل شيء فوراً بعد القياس (تغيير DOM متزامن بلا رسم).
   يعيد {kind, restore} أو null للأنواع الثابتة.
   • classify   : كل البطاقات في أضيق صندوق (أطول التفاف = أقصى ارتفاع للصف).
   • fill-blank : كل فراغ بأطول كلمة متاحة (أقصى التفاف للجملة).
   • drag-drop  : صناديق الأهداف مطلقة فوق الصورة (لا تُنمّي الطول) — نملؤها
                  بنصوص إجاباتها للاكتمال؛ الحالة الابتدائية عملياً هي الأقصى.
   • sequence   : كل العناصر ظاهرة أصلاً؛ الترتيب لا يغيّر الطول — الابتدائية هي الأقصى. */
function worstCaseArrange(w){
  /* — التصنيف — */
  var drops=w.querySelectorAll('.grp-drop');
  var clsBank=w.querySelector('.clsbank .chips');
  if(drops.length && clsBank){
    var zones=[clsBank]; for(var d=0;d<drops.length;d++) zones.push(drops[d]);
    var snap=zones.map(function(z){
      return {zone:z, chips:Array.prototype.filter.call(z.children,function(el){
        return el.classList&&el.classList.contains('chip'); })};
    });
    var target=drops[0];              /* أضيق صندوق = أكثر التفافاً */
    for(var i=1;i<drops.length;i++){ if(drops[i].clientWidth<target.clientWidth) target=drops[i]; }
    snap.forEach(function(s){ s.chips.forEach(function(c){ target.appendChild(c); }); });
    return {kind:'classify', restore:function(){
      snap.forEach(function(s){ s.chips.forEach(function(c){ s.zone.appendChild(c); }); }); }};
  }
  /* — ملء الفراغ — */
  var blanks=w.querySelectorAll('.blank');
  var fbChips=w.querySelectorAll('.fillbank .chips .chip');
  if(blanks.length && fbChips.length){
    var longest=''; Array.prototype.forEach.call(fbChips,function(c){
      var t=c.textContent||''; if(t.length>longest.length) longest=t; });
    var bsnap=Array.prototype.map.call(blanks,function(b){ return {b:b, txt:b.textContent}; });
    /* أطول محتوى لكل فراغ = الأطول بين النائب "______" وأطول كلمة */
    bsnap.forEach(function(o){ if(longest.length>(o.txt||'').length) o.b.textContent=longest; });
    return {kind:'fill-blank', restore:function(){
      bsnap.forEach(function(o){ o.b.textContent=o.txt; }); }};
  }
  /* — السحب على صورة — */
  var targets=w.querySelectorAll('.target');
  if(targets.length){
    var tsnap=Array.prototype.map.call(targets,function(t){ return {t:t, txt:t.textContent}; });
    tsnap.forEach(function(o){ var a=o.t.getAttribute('data-answer'); if(a) o.t.textContent=a; });
    return {kind:'drag-drop', restore:function(){
      tsnap.forEach(function(o){ o.t.textContent=o.txt; }); }};
  }
  /* — الترتيب التسلسلي (ثابت الطول) — */
  if(w.querySelector('.seqitem')) return {kind:'sequence', restore:function(){}};
  return null;
}
/* الخوارزمية الكاملة لبطاقة واحدة: اختيار ثم ضبط.
   الاتساع رتيب مع عرض الإطار (أكبر = نافذة أعلى وأقلّ التفاف)، فنعتمد بحثاً ثنائياً.
   التكبير عند اللزوم يكون للإطار كاملاً بمقياس موحّد يحفظ نسبته تماماً —
   بلا سقف نسبة، وإنما حدّه الوحيد عرض الشاشة الفعلي (والصفحة تتمرر عمودياً
   إن طال الإطار — لا تمرير داخلياً أبداً). التصغير حدّه −25%.
   نمرّ s→m→l ونأخذ أوّل إطار يسع عند أقصى عرضه، ثم أصغر عرض يسع داخله.
   الإطار الأعرض من عمود السؤال يُوسَّط فوقه بهوامش سالبة (النسبة محفوظة).
   الملاذ المطاطي (qflex) يبقى فقط لو ضاقت الشاشة نفسها عن أكبر إطار. */
function fitFrame(card){
  var f=card.querySelector('.qframe'),
      fill=card.querySelector('.qfill'),
      w=card.querySelector('.qwin');
  if(!f||!w) return;
  /* قِس بأسوأ الحالات (للأنواع المتحرّكة) ثم أعِد كل شيء كما كان في finally */
  var _wc=worstCaseArrange(w);
  var _restore=_wc&&_wc.restore;
  var _kind=(_wc&&_wc.kind)||'static';
  var _worstH=0;                     /* ارتفاع المحتوى بأسوأ الحالات (للتقرير) */
  var _prevW=f.style.width;          /* العرض المُثبَّت قبل هذا الضبط (للانتقال السلس) */
  f.style.transition='none';         /* عطّل الانتقال أثناء القياس ليطبَّق العرض فوراً */
  try{
  var availH=availHeight();
  var contW=(card.clientWidth||600);
  var Wceil=Math.max(contW, Math.min(1240, window.innerWidth-60));

  f.style.marginLeft=''; f.style.marginRight='';
  /* قيّم المرشحين الثلاثة: أصغر عرض يسع لكل منهم، ثم اختر أصغرهم مساحةً
     نهائية — فلا يأخذ سؤال قصير إطاراً عريضاً ضخماً لمجرد أنه «يسع» */
  var best=null;
  for(var i=0;i<FRAME_ORDER.length;i++){
    var size=FRAME_ORDER[i], cfg=FRAME_SIZES[size], r=frameAR(cfg);
    var baseW=BASE_FILL*availH/r;                 /* عرض مقياس 1 */
    var Wmax=Wceil;                               /* التكبير حرّ بنسبة محفوظة */
    var Wmin=Math.min(Wmax, CAP_DOWN*baseW);      /* أدنى عرض (−25%) */
    if(!frameFits(f,fill,w,size,Wmax)) continue;  /* لا يسع حتى عند الأكبر */
    /* بحث ثنائي عن أصغر عرض يسع في [Wmin,Wmax] (hi يسع دائماً) */
    var lo=Wmin, hi=Wmax;
    for(var it=0; it<16; it++){
      var mid=(lo+hi)/2;
      if(frameFits(f,fill,w,size,mid)) hi=mid; else lo=mid;
    }
    var area=hi*(hi*r);
    if(!best || area<best.area) best={size:size, W:hi, baseW:baseW, area:area};
  }
  if(!best){ toFlex(f,fill,w,'l'); card.dataset.fit='flex'; _worstH=w.scrollHeight; return; }
  frameFits(f,fill,w,best.size,best.W);           /* ثبّت الفائز */
  _worstH=w.scrollHeight;                          /* ارتفاع أسوأ الحالات في الإطار الفائز */
  if(best.W>contW){                               /* أعرض من العمود → وسّطه فوقه */
    var mrg=(contW-best.W)/2;
    f.style.marginLeft=mrg+'px'; f.style.marginRight=mrg+'px';
  }
  card.dataset.fit=best.size+'@'+Math.round(best.W/best.baseW*100)+'%';
  }finally{
    if(_restore) _restore();
    /* القياس تمّ بلا انتقال؛ الآن نُحرّك التغيّر النهائي في العرض بسلاسة:
       نقفز للعرض السابق فوراً ثم نُعيد الانتقال ونضبط العرض النهائي فيتحرّك. */
    var _finalW=f.style.width;
    if(!f.classList.contains('qflex') && _prevW && _prevW!==_finalW){
      f.style.width=_prevW; void f.offsetWidth;
      f.style.transition=''; f.style.width=_finalW;
    } else {
      f.style.transition='';
    }
    /* تقرير تطويري + فحص قداسة نسبة الأبعاد: بعد كل ضبط نقارن النسبة المعروضة
       (العرض/الارتفاع الفعليّين) بالنسبة الأصلية لصورة الإطار، ونطبع تحذيراً
       صارخاً إن اختلفتا بأكثر من 1% — فأي كسر مستقبليّ يُكشف فوراً. */
    if(DEV){
      var _fit=card.dataset.fit||'?';
      var _sz=_fit.split('@')[0];
      var _fr=f.getBoundingClientRect();
      var _shownAR=_fr.height>0?_fr.width/_fr.height:0;
      var _origAR=null, _ratioOK=null;
      if(_sz!=='flex' && FRAME_SIZES[_sz]){
        var _p=FRAME_SIZES[_sz].ar.split('/');
        _origAR=parseFloat(_p[0])/parseFloat(_p[1]);
        var _diff=Math.abs(_shownAR-_origAR)/_origAR;
        _ratioOK=_diff<=0.01;
        if(!_ratioOK) console.warn('%c[إطار] ⛔ كُسِرت نسبة الأبعاد! '+_kind+' ('+_fit+') — '+
          'أصلية '+_origAR.toFixed(4)+' / معروضة '+_shownAR.toFixed(4)+
          ' (فرق '+(_diff*100).toFixed(1)+'%)','color:#c0392b;font-weight:bold;font-size:13px');
      } else if(_sz==='flex'){
        console.warn('[إطار] ⚠️ الحاوية المرنة (qflex) ملاذٌ أخير — نسبة الإطار غير مثبّتة هنا. '+_kind);
      }
      console.log('%c[إطار] '+_kind+' → '+_fit+
        ' | نسبة أصلية '+(_origAR?_origAR.toFixed(4):'—')+' / معروضة '+_shownAR.toFixed(4)+' '+
        (_ratioOK===true?'✓':(_ratioOK===false?'✗':'(flex)'))+
        ' | أسوأ الحالات ≈'+Math.round(_worstH)+'px | نافذة '+w.clientHeight+'px'+
        ' | RO:'+(card.dataset.roIntervened?'⚠️تدخّل':'✔'),
        'color:#2B5748;font-weight:bold');
    }
  }
}
function enhanceNav(){
  frameize();
  document.querySelectorAll('.qnav .qprev:not([data-img])').forEach(function(b){
    b.dataset.img='1'; b.classList.add('nav-btn','nav-prev');
    b.innerHTML='<img src="images/ui/btn-next-prev.png" alt="">'+
                '<span class="ncap">السابق</span>';
  });
  document.querySelectorAll('.qnav .qnext:not([data-img])').forEach(function(b){
    b.dataset.img='1'; b.classList.add('nav-btn','nav-next');
    b.innerHTML='<img src="images/ui/btn-next-prev.png" alt="">'+
                '<span class="ncap">التالي</span>';
  });
}
/* يضبط البطاقة الظاهرة فقط، مع حارس يمنع حلقة المراقب (كتابتنا للأنماط
   تُطلق المراقب) وتوقيع يتجنّب إعادة الحساب دون داعٍ */
var _fitBusy=false;
function fitShown(){
  if(_fitBusy) return;
  var shown=currentShown();
  if(!shown||!shown.querySelector('.qframe')) return;
  var sig=(shown.clientWidth||0)+'x'+Math.round(availHeight());
  if(shown.dataset.fitSig===sig && shown.dataset.fit) return;
  shown.dataset.fitSig=sig;
  _fitBusy=true;
  try{ fitFrame(shown); }
  finally{ setTimeout(function(){_fitBusy=false;},0); }
}

/* ═══ إعادة حساب ديناميكية: شبكة أمان بمراقب أبعاد على محتوى النافذة ═══
   «أسوأ الحالات» يمنع تغيّر المقاس أثناء الإجابة سلفاً؛ وهذا المراقب احتياطٌ
   إن نما المحتوى وفاض رغم ذلك (تقدير ناقص أو نوع سؤال آخر ينمو): نُبطل التوقيع
   ونعيد الاختيار والضبط (بانتقال CSS سلس). إن عجز أكبر إطار → الحاوية المرنة
   (qflex) التي تنمو تلقائياً بلا فيضان ولا تمرير. */
var _croRAF=0;
function onContentResize(){
  if(_croRAF) return;
  _croRAF=requestAnimationFrame(function(){
    _croRAF=0;
    if(_fitBusy) return;
    var shown=currentShown(); if(!shown) return;
    var w=shown.querySelector('.qwin'); if(!w) return;
    if(shown.dataset.fit==='flex') return;          /* المرنة تنمو تلقائياً */
    if(w.scrollHeight > w.clientHeight+2){            /* فائض فعليّ → كبّر الإطار */
      if(DEV) console.warn('[إطار] ResizeObserver تدخّل: المحتوى فاض بعد الحساب المسبق ('+
        w.scrollHeight+'>'+w.clientHeight+'px) — إعادة الاختيار والضبط. (تقدير مسبق ناقص)');
      shown.dataset.roIntervened='1';               /* يُسجَّل في التقرير التالي */
      shown.dataset.fitSig='';
      fitShown();
      watchShown();
    }
  });
}
var contentRO = window.ResizeObserver ? new ResizeObserver(onContentResize) : null;
function watchShown(){
  if(!contentRO) return;
  var shown=currentShown(); if(!shown) return;
  var w=shown.querySelector('.qwin'); if(!w) return;
  try{ contentRO.disconnect(); }catch(e){}
  /* نراقب أبناء النافذة (تنمو أطوالهم مع توزيع البطاقات) — النافذة نفسها ثابتة الأبعاد */
  Array.prototype.forEach.call(w.children,function(ch){ contentRO.observe(ch); });
}

new MutationObserver(function(){ if(_fitBusy) return; enhanceNav(); fitShown(); watchShown(); })
  .observe(document.getElementById('questionList'),
    {childList:true,subtree:true,attributes:true,attributeFilter:['style']});
window.addEventListener('resize',function(){
  document.querySelectorAll('.qcard').forEach(function(c){c.dataset.fitSig='';});
  fitShown(); watchShown();
});

/* فتح درس «الطيور المُدهشة» تلقائياً بعد اكتمال تحميل البيانات
   (DATA معرّف بـ let في app.js فلا يظهر على window — نفحصه داخل try) */
(function(){
  function ready(){
    try{ return DATA && DATA.terms && DATA.terms['الأول'] && DATA.index && DATA.index['g4-sci']; }
    catch(e){ return false; }
  }
  var tries=0;
  var t=setInterval(function(){
    if(ready()){
      clearInterval(t);
      try{
        openBook('g4-sci');
        openLesson({ title:'الطيور المُدهشة', file:'g4s-2-1', open:true });
        enhanceNav();
      }catch(e){ console.error('تعذّر فتح الدرس تلقائياً:', e); }
    }else if(++tries>50){ clearInterval(t); }
  },100);
})();

/* ═══ اهتزاز لطيف عند خطأ التوصيل ═══
   محرّك التوصيل في app.js لا يضيف صنفاً عند الخطأ، بل يفرض خلفية وردية inline
   لنصف ثانية. أسلوبنا الزجاجي يتجاهل تلك الوردية (background !important)،
   ونكتفي هنا بإضافة صنف .shake مؤقتاً على البطاقة اليمنى لإطلاق الاهتزاز.
   نستمع في طور الالتقاط: إن كان هناك اختيارٌ يساري قائم ولم تُطابَق البطاقة
   بعد النقر، فتلك محاولة خاطئة → اهتزاز. (يعمل داخل الصفحة التجريبية فقط.) */
document.getElementById('questionList').addEventListener('click', function(e){
  var right=e.target.closest('.mitem.right');
  if(!right || right.classList.contains('matched')) return;
  var hasSel=document.querySelector('.mitem.left.selected');
  if(!hasSel) return;                       /* بلا اختيار → لا تغذية (كمنطق app.js) */
  setTimeout(function(){
    if(!right.classList.contains('matched')){ /* لم تُطابَق → محاولة خاطئة */
      right.classList.remove('shake');       /* إعادة التشغيل لو تكرّر الخطأ */
      void right.offsetWidth;
      right.classList.add('shake');
      setTimeout(function(){ right.classList.remove('shake'); }, 500);
    }
  }, 0);
}, true);
</script>
