<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مختبر المجسّمات — شوجب</title>
<meta name="robots" content="noindex">
<!--
  ⚠️ صفحة تجريبية منفصلة: مجسّمٌ ثلاثيُّ الأبعاد داخلَ الإطار القمريّ للعلوم (frame-moon-l)
  يُدارُ باللمس أو الفأرة. لا رابطَ إليها من الرئيسة، ولا تعتمدُ على css/style.css ولا js/app.js.
  - المجسّماتُ من سير n8n «شوجب — مولّد المجسّمات (Meshy)»، مضغوطةً (خامات WebP بـ1024px)
    في مجلّد models/. لإضافة مجسّم: انسخ ملفّه إلى models/ وأضف سطراً في MODELS أدناه.
  - «المجمر العماني» (majmar) من حساب المالك في Sketchfab (‏@shooogp، رخصة CC BY باسمه)،
    مضغوطٌ بخامات WebP بـ2048px (‏12.4 م.ب ← 2.5 م.ب).
  - نافذةُ المجسّم = إزاحاتُ نافذةِ الإطارِ نفسُها في js/shoogp-ui.js (FRAMES أدناه).
  - وسمُ ?v= على الصور والمجسّمات يُختَمُ تلقائياً عند النشر (pages.yml) فيكسرُ ذاكرةَ المتصفّح.
  - مباشرةً إلى مجسّم: lab-3d.html?m=pie · وبإطار الرياضيات: lab-3d.html?m=pie&f=math
  - الإطاران (العلوم frame-moon-l · الرياضيات frame-math-l) في FRAMES أدناه، يبدّلهما زرّا الترويسة.
-->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#eef0ff;
  --sand:#f6c27e;
  --sand-deep:#c98a43;
  --orange:#f5a04a;
}
html,body{height:100%}
body{
  color:var(--ink);
  min-height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  /* خلفيةُ المادّة نفسُها (body.theme-sci / theme-math في css/style.css) + نجومٌ خفيفة */
  --stars:
    radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1.2px 1.2px at 78% 12%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.6px 1.6px at 88% 46%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 6% 62%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.4px 1.4px at 22% 88%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 92%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.3px 1.3px at 44% 6%, rgba(255,255,255,.55), transparent 60%);
  background:var(--stars), linear-gradient(180deg,#1c2540 0%,#243a54 32%,#2f5560 65%,#3a7566 100%);
}
body[data-frame="math"]{
  background:var(--stars), linear-gradient(180deg,#22253f 0%,#333f54 32%,#47605a 65%,#5a7a55 100%);
}

/* ═══ الترويسة ═══ */
.top{
  width:100%;max-width:1200px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;
  padding:14px 20px 0;
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:48px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand h1{font-size:24px;font-weight:800;letter-spacing:0;line-height:1.2}
.brand small{display:block;font-size:14px;font-weight:700;color:var(--sand)}

/* ═══ مبدّلُ الإطار ═══ */
.seg{
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);
}
.seg button{
  display:flex;align-items:center;gap:8px;
  min-height:60px;padding:6px 18px 6px 10px;
  border:none;border-radius:999px;cursor:pointer;background:transparent;
  font-size:18px;font-weight:700;color:var(--ink);
  transition:background .15s ease, color .15s ease;
}
.seg button img{width:44px;height:44px;object-fit:contain}
.seg button:hover{background:rgba(255,255,255,.1)}
.seg button[aria-pressed="true"]{
  background:linear-gradient(180deg,#ffb35c,#f08a2c);color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
}

/* ═══ المسرح: الإطار في المنتصف ═══ */
.stage{
  flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:8px 16px;
  container-type:size;
}
.frame{
  position:relative;
  /* نسبةُ صورةِ الإطارِ الفعلية — خطٌّ أحمر؛ تُكتَبُ من FRAMES في الأسفل */
  --ar:1246 / 1222; --r:1.0196;
  --wt:10.5%; --wl:12.5%; --wr:11.5%; --wb:11.5%; --wrad:16% / 16%;
  aspect-ratio:var(--ar);
  /* أكبرُ مقاسٍ يسعُه المسرحُ عرضاً وارتفاعاً معاً، فلا تنكسرُ النسبة */
  width:min(94vw, 70vh * var(--r), 900px);
  width:min(100cqw, 100cqh * var(--r), 900px);
}
.rim{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;                     /* الفائضُ فراغٌ لا مطّ */
  pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 14px 28px rgba(0,0,0,.45));
}
/* نافذةُ المجسّم = نافذةُ الإطار */
.win{
  position:absolute;
  top:var(--wt);left:var(--wl);right:var(--wr);bottom:var(--wb);
  border-radius:var(--wrad);
  overflow:hidden;
}
model-viewer{
  width:100%;height:100%;
  background:transparent;
  --poster-color:transparent;
  --progress-bar-color:var(--orange);
  --progress-bar-height:6px;
  outline:none;
}
model-viewer::part(default-progress-bar){border-radius:3px}

/* رسالةُ الخطأ داخلَ النافذة */
.msg{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;text-align:center;
  padding:12%;font-size:22px;font-weight:700;color:#5a3307;
}
body[data-frame="math"] .msg{color:#fff}
.msg.on{display:flex}

/* ═══ شريطُ المجسّمات ═══ */
.dock{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;
  padding:6px 16px 18px;
}
.chip{
  display:flex;align-items:center;gap:10px;
  min-height:64px;padding:6px 18px 6px 10px;
  border:none;border-radius:999px;cursor:pointer;
  font-size:20px;font-weight:700;color:#3b2306;
  background:linear-gradient(180deg,#fbd9a4,#f0b468);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.25);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.chip img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.chip:hover{filter:brightness(1.05)}
.chip:active{transform:translateY(2px)}
.chip[aria-pressed="true"]{
  background:linear-gradient(180deg,#ffb35c,#f08a2c);color:#fff;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 0 0 3px rgba(255,255,255,.85), 0 6px 16px rgba(0,0,0,.3);
}
.reset{
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);color:var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
  transition:background .15s ease, transform .15s ease;
}
.reset:hover{background:rgba(255,255,255,.22)}
.reset:active{transform:translateY(2px)}
.reset svg{width:30px;height:30px}

@media (max-width:640px){
  .top{justify-content:center;padding-top:10px}
  .brand h1{font-size:19px}
  .brand img{height:38px}
  .seg button{font-size:16px;padding:6px 14px 6px 8px}
  .seg button img{width:38px;height:38px}
  .chip{font-size:17px;min-height:60px}
  .chip img{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){
  .chip,.reset,.seg button{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="images/logo-mark.png?v=0" alt="شوجب">
    <h1>مختبر المجسّمات<small>صفحة تجريبية</small></h1>
  </div>
  <div class="seg" id="seg" role="group" aria-label="الإطار"></div>
</header>

<main class="stage">
  <div class="frame" id="frame">
    <img class="rim" id="rim" src="images/ui/frame-moon-l.png?v=0" alt="">
    <div class="win">
      <model-viewer id="mv"
        camera-controls
        touch-action="none"
        auto-rotate
        auto-rotate-delay="2500"
        rotation-per-second="18deg"
        interaction-prompt="auto"
        interaction-prompt-threshold="2500"
        shadow-intensity="1"
        shadow-softness="0.9"
        exposure="1.05"
        camera-orbit="0deg 68deg 105%"
        min-camera-orbit="auto auto 70%"
        max-camera-orbit="auto auto 160%"
        field-of-view="30deg"
        alt="مجسّم ثلاثي الأبعاد">
      </model-viewer>
      <div class="msg" id="msg">تعذّر تحميل المجسّم</div>
    </div>
  </div>
</main>

<nav class="dock" id="dock" aria-label="المجسّمات"></nav>

<script>
/* قائمةُ المجسّمات — أضف سطراً لكلّ مجسّمٍ جديدٍ في models/ */
var MODELS = [
  /* orbit اختياريّ: زاوية الكاميرا الأولى لهذا المجسّم (وإلا الافتراضية) */
  { id:'majmar',       name:'المجمر العماني', file:'models/majmar.glb?v=0',     thumb:'models/majmar.png?v=0', orbit:'20deg 72deg 105%' },
  { id:'brain',        name:'الدماغ',         file:'models/brain.glb?v=0',      thumb:'models/brain.png?v=0',  orbit:'110deg 78deg 110%' },
  { id:'samosa',     name:'سمبوسة',       file:'models/samosa.glb?v=0',       thumb:'models/samosa.png?v=0' },
  { id:'pie',          name:'فطيرة',        file:'models/pie.glb?v=0',          thumb:'models/pie.png?v=0' },
  { id:'chicken-rice', name:'أرز بالدجاج',  file:'models/chicken-rice.glb?v=0', thumb:'models/chicken-rice.png?v=0' }
];

/* الإطارات — مقاس l من كلِّ عائلة. ar وwin منقولةٌ حرفياً من FRAME_FAMILIES في
   js/shoogp-ui.js (moon.l و math.l)؛ إن تغيّرت هناك تُغيَّر هنا. r = عرض÷ارتفاع. */
var FRAMES = {
  sci:  { name:'العلوم',    img:'images/ui/frame-moon-l.png?v=0', ar:'1246 / 1222', r:1246/1222,
          win:{t:'10.5%', l:'12.5%', r:'11.5%', b:'11.5%'}, rad:'16% / 16%' },
  math: { name:'الرياضيات', img:'images/ui/frame-math-l.png?v=0', ar:'1261 / 1247', r:1261/1247,
          win:{t:'13%',   l:'15%',   r:'15%',   b:'18.5%'}, rad:'12% / 12%' }
};

var mv   = document.getElementById('mv');
var dock = document.getElementById('dock');
var msg  = document.getElementById('msg');
var seg  = document.getElementById('seg');
var frame = document.getElementById('frame');
var rim  = document.getElementById('rim');
var chips = {}, segBtns = {};
var BASE_ORBIT = mv.getAttribute('camera-orbit');
var DEFAULT_ORBIT = BASE_ORBIT;
var cur = { m:null, f:'sci' };

function syncURL(){
  var p = new URLSearchParams();
  if (cur.m) p.set('m', cur.m);
  if (cur.f !== 'sci') p.set('f', cur.f);
  try { history.replaceState(null, '', '?' + p.toString()); } catch(e){}
}

function setFrame(key){
  var f = FRAMES[key] || FRAMES.sci;
  key = FRAMES[key] ? key : 'sci';
  var s = frame.style;
  s.setProperty('--ar', f.ar); s.setProperty('--r', String(f.r));
  s.setProperty('--wt', f.win.t); s.setProperty('--wl', f.win.l);
  s.setProperty('--wr', f.win.r); s.setProperty('--wb', f.win.b);
  s.setProperty('--wrad', f.rad);
  rim.src = f.img;
  document.body.dataset.frame = key;
  Object.keys(segBtns).forEach(function(k){ segBtns[k].setAttribute('aria-pressed', k === key ? 'true' : 'false'); });
  cur.f = key; syncURL();
}

function show(id){
  var m = MODELS.filter(function(x){ return x.id === id; })[0] || MODELS[0];
  msg.classList.remove('on');
  DEFAULT_ORBIT = m.orbit || BASE_ORBIT;
  mv.src = m.file;
  mv.alt = 'مجسّم ' + m.name;
  Object.keys(chips).forEach(function(k){ chips[k].setAttribute('aria-pressed', k === m.id ? 'true' : 'false'); });
  cur.m = m.id; syncURL();
}

/* أزرارُ الإطار، وتحميلُ صورِها مسبقاً فلا يومضُ الإطارُ عند التبديل */
Object.keys(FRAMES).forEach(function(k){
  var f = FRAMES[k];
  var b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = '<img alt="" src="' + f.img + '"><span>إطار ' + f.name + '</span>';
  b.addEventListener('click', function(){ setFrame(k); });
  segBtns[k] = b; seg.appendChild(b);
  (new Image()).src = f.img;
});

function resetView(){
  mv.cameraOrbit = DEFAULT_ORBIT;
  mv.fieldOfView = '30deg';
  mv.jumpCameraToGoal();
}

MODELS.forEach(function(m){
  var b = document.createElement('button');
  b.className = 'chip'; b.type = 'button';
  b.innerHTML = '<img alt="" src="' + m.thumb + '"><span>' + m.name + '</span>';
  b.addEventListener('click', function(){ show(m.id); });
  chips[m.id] = b; dock.appendChild(b);
});

var r = document.createElement('button');
r.className = 'reset'; r.type = 'button';
r.title = 'إعادة الوضع'; r.setAttribute('aria-label', 'إعادة الوضع');
r.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
r.addEventListener('click', resetView);
dock.appendChild(r);

mv.addEventListener('load', function(){ resetView(); });
mv.addEventListener('error', function(){ msg.classList.add('on'); });

/* إخفاءُ الشريط إن كان مجسّماً واحداً */
if (MODELS.length < 2) { Object.keys(chips).forEach(function(k){ chips[k].style.display = 'none'; }); }

var qs = new URLSearchParams(location.search);
setFrame(qs.get('f') || 'sci');
show(qs.get('m') || MODELS[0].id);
</script>
</body>
</html>
