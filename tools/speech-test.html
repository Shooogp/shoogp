<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>تجربة سؤال النطق — شوجب</title>
<!-- صفحةُ تجربةٍ ميدانيةٍ لا نوعُ سؤالٍ معتمَد (٢٠٢٦-٠٩-١٩): سؤالٌ واحدٌ يطلبُ نطقَ كلمةٍ ويحكمُ عليها
     بمحرّكِ التعرّفِ في المتصفّح (Web Speech API — Chrome/Edge، يحتاجُ إنترنت وميكروفوناً).
     الغرضُ قياسُ الدقّةِ على سبّورةِ المعلّمِ مع تلاميذَ حقيقيّين قبلَ قرارِ بناءِ النوع. -->
<style>
  body{font:17px/1.7 Cairo,Tahoma,sans-serif;margin:0;padding:16px;background:#1d1830;color:#f4f0ff}
  h1{font-size:20px;margin:0 0 4px} .sub{color:#cfc6ee;margin:0 0 14px;font-size:14px}
  .q{max-width:560px;margin:0 auto;background:#2a2340;border-radius:22px;padding:20px;text-align:center;direction:ltr}
  .prompt{font-size:24px;font-weight:800;margin:0 0 10px}
  .pic{width:190px;height:190px;object-fit:contain;background:#fdf9ee;border-radius:20px;padding:12px}
  .word{font-size:44px;font-weight:900;letter-spacing:1px;margin:6px 0 12px}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;color:#fff;min-width:150px}
  #listen{background:#20A0FF} #mic{background:#FF6000} #mic.rec{background:#FF2020;animation:pulse 1s infinite}
  #teacher{background:#3d3560;font-size:15px;min-width:0;padding:10px 16px;margin-top:12px}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #fb{min-height:40px;margin:14px 0 0;font-size:22px;font-weight:800}
  #fb.ok{color:#a7c957} #fb.retry{color:#ffd166} #fb.err{color:#ff8a80;font-size:16px;direction:rtl}
  .panel{max-width:560px;margin:14px auto 0;background:#2a2340;border-radius:16px;padding:14px;font-size:14px}
  .panel h2{font-size:15px;margin:0 0 6px;color:#cfc6ee}
  #stats{font-size:18px;font-weight:800;margin-bottom:6px}
  #log{direction:ltr;text-align:left;margin:0;padding:0;list-style:none;max-height:240px;overflow:auto}
  #log li{border-bottom:1px solid #3d3560;padding:4px 0} .y{color:#a7c957} .n{color:#ff8a80}
  #copy{background:#20A0FF;font-size:15px;min-width:0;padding:8px 14px;margin-top:8px}
</style></head><body>
<h1>تجربة سؤال النطق</h1>
<p class="sub">سؤالٌ واحدٌ للتجربة على السبّورة. يعملُ في Chrome أو Edge، ويحتاجُ إنترنت وميكروفوناً وإذنَ استعمالِه.</p>

<div class="q">
  <p class="prompt">Listen, then say the word.</p>
  <img class="pic" src="../images/كرة.png" alt="">
  <div class="word">ball</div>
  <div class="row">
    <button id="listen">▶ Listen</button>
    <button id="mic">🎤 Say it</button>
  </div>
  <div id="fb"></div>
  <button id="teacher" title="للمعلّمة: إن نطقَ التلميذُ صحيحاً ولم يتعرّفِ المحرّك">✓ Teacher: correct</button>
</div>

<div class="panel" dir="rtl">
  <h2>سجلُّ المحاولات — هذا ما نقيسُه</h2>
  <div id="stats">لم تبدأ بعد</div>
  <ul id="log"></ul>
  <button id="copy">انسخ السجلّ</button>
</div>

<script>
const WORD='ball';
/* قبولٌ متسامح: الكلمةُ نفسُها أو جمعُها أو ما يُسمَعُ مثلَها تماماً (جِناسٌ صوتيٌّ لا فرقَ فيه في الأذن). */
const ACCEPT=['ball','balls','bawl','boll','the ball','a ball'];
const fb=document.getElementById('fb'), mic=document.getElementById('mic'), log=document.getElementById('log'), stats=document.getElementById('stats');
let tries=0, hits=0, teacherOk=0, lines=[];
const say=(t,c)=>{fb.textContent=t;fb.className=c||'';};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z' ]/g,'').trim();

document.getElementById('listen').onclick=()=>{const a=new Audio('../audio/en/ball.mp3?t='+Date.now());a.play();};

function record(alts,err){
  tries++;
  const heard=alts.map(a=>norm(a.text));
  const ok=heard.some(h=>ACCEPT.includes(h));
  if(ok) hits++;
  const line='#'+tries+'  '+(err?('['+err+']'):alts.map(a=>a.text+' ('+Math.round(a.conf*100)+'%)').join(' · '))+'  → '+(ok?'ACCEPTED':'not recognised');
  lines.push(line);
  const li=document.createElement('li'); li.className=ok?'y':'n'; li.textContent=line; log.prepend(li);
  stats.textContent='تعرّفَ على '+hits+' من '+tries+' محاولة ('+Math.round(hits/tries*100)+'٪)'+(teacherOk?' · وصحّحتِ المعلّمةُ يدوياً '+teacherOk:'');
  if(ok) say('🎉 Well done!','ok');
  else if(err==='no-speech') say('I didn\'t hear you — try again 🎤','retry');
  else if(!err) say('Try again 🎤','retry');       /* لا «خطأ» إطلاقاً: المحرّكُ قد يخطئُ والتلميذُ مصيب */
  return ok;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ mic.disabled=true; mic.style.opacity=.4; say('هذا المتصفّحُ لا يدعمُ التعرّفَ على الكلام — افتحِ الصفحةَ في Chrome أو Edge.','err'); }
else{
  let rec=null, busy=false;
  mic.onclick=()=>{
    if(busy){ try{rec.stop();}catch(e){} return; }
    rec=new SR(); rec.lang='en-US'; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
    let got=false;
    rec.onstart=()=>{busy=true;mic.classList.add('rec');mic.textContent='● Listening…';say('');};
    rec.onresult=e=>{got=true;const r=e.results[0];const alts=[];for(let i=0;i<r.length;i++)alts.push({text:r[i].transcript,conf:r[i].confidence||0});record(alts);};
    rec.onerror=e=>{got=true;
      if(e.error==='not-allowed'||e.error==='service-not-allowed') say('الميكروفونُ مرفوضٌ — اسمحْ به من قفلِ شريطِ العنوان ثمّ أعدِ المحاولة.','err');
      else if(e.error==='audio-capture') say('لا ميكروفونَ موصولٌ بهذا الجهاز.','err');
      else if(e.error==='network') say('لا اتصالَ بالإنترنت — التعرّفُ يحتاجُه.','err');
      else record([],e.error);
    };
    rec.onend=()=>{busy=false;mic.classList.remove('rec');mic.textContent='🎤 Say it';if(!got)record([],'no-speech');};
    try{rec.start();}catch(e){say('تعذّرَ تشغيلُ الميكروفون: '+e.message,'err');}
  };
}
document.getElementById('teacher').onclick=()=>{teacherOk++;lines.push('teacher marked correct');say('🎉 Well done!','ok');
  stats.textContent=(tries?('تعرّفَ على '+hits+' من '+tries+' محاولة ('+Math.round(hits/tries*100)+'٪)'):'بلا محاولاتٍ آليّة')+' · وصحّحتِ المعلّمةُ يدوياً '+teacherOk;};
document.getElementById('copy').onclick=()=>{const t=document.createElement('textarea');t.value='speech-test «'+WORD+'» — '+stats.textContent+'\n'+navigator.userAgent+'\n'+lines.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();};
window.__record=record;   /* للاختبارِ الآليِّ بلا ميكروفون */
</script>
</body></html>
