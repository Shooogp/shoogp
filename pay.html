<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فتح كتاب — شوجب</title>

<!--
  ═══════════════════════════════════════════════════════════════
  نموذج مستقل للتجربة الفورية. بعد نجاحه يحوّله كلود كود إلى
  نافذة (modal) تُفتح من قفل الوحدة، ويأخذ الألوان من هوية الكتاب.
  المطلوب تعديله قبل التشغيل: قسم CONFIG أسفل الصفحة.
  ═══════════════════════════════════════════════════════════════
-->

<style>
:root{
  --space:#0F131B;          /* خلفية الفضاء */
  --panel:#171D28;          /* جسم اللوحة */
  --stone:#C9A227;          /* رمليّ — نفس لون قفل الشراء */
  --stone-soft:#E3C766;
  --moon:#EDE8DE;           /* أبيض القمر */
  --muted:#8A93A3;
  --line:#242C3A;
  --danger:#E0705F;
  --ok:#5FBF8B;
}
*{box-sizing:border-box}
body{
  margin:0; padding:32px 16px; min-height:100vh;
  background:var(--space);
  color:var(--moon);
  font-family:"Tajawal","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  font-size:18px; line-height:1.9;
}
.wrap{max-width:560px;margin:0 auto}
/* رابطُ العودة — بهيئةِ زرِّ الرجوعِ في المنصّة (`.back` في css/style.css) */
.back{
  display:inline-block;margin:0 0 18px;padding:10px 18px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:16px;text-decoration:none;
}
.back:hover{background:rgba(255,255,255,.2)}
h1{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:16px;margin:0 0 28px}

.step{
  background:var(--panel); border:1px solid var(--line);
  border-radius:18px; padding:22px; margin-bottom:16px;
}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-num{
  width:30px;height:30px;flex:none;border-radius:50%;
  background:var(--stone);color:#1A1206;
  display:grid;place-items:center;font-weight:700;font-size:16px;
}
.step-title{font-weight:700;font-size:19px}

label{display:block;font-size:16px;color:var(--muted);margin:14px 0 6px}
select,input[type=text],input[type=tel]{
  width:100%;padding:14px;border-radius:12px;
  background:#0D111A;border:1px solid var(--line);
  color:var(--moon);font:inherit;font-size:17px;
}
select:focus,input:focus,button:focus-visible{
  outline:2px solid var(--stone-soft);outline-offset:2px;
}

.amount{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding:14px 16px;border-radius:12px;
  background:#0D111A;border:1px dashed var(--line);
}
.amount b{font-size:24px;color:var(--stone-soft)}

.acct{margin-top:12px}
.acct-row{
  display:flex;align-items:center;gap:8px;
  background:#0D111A;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-top:8px;
}
.acct-row span{flex:1;font-family:ui-monospace,monospace;font-size:17px;letter-spacing:.5px}
.copy{
  background:transparent;border:1px solid var(--line);color:var(--stone-soft);
  border-radius:9px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;
}
.copy:hover{border-color:var(--stone)}

.drop{
  margin-top:6px;border:2px dashed var(--line);border-radius:14px;
  padding:24px 16px;text-align:center;cursor:pointer;
  transition:border-color .18s, background .18s;
}
.drop:hover,.drop.over{border-color:var(--stone);background:#0D111A}
.drop.filled{border-style:solid;border-color:var(--ok)}
.drop-hint{color:var(--muted);font-size:15px;margin-top:4px}
input[type=file]{display:none}

.go{
  width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;
  background:var(--stone);color:#1A1206;font:inherit;font-weight:700;font-size:19px;
  cursor:pointer;transition:filter .18s;
}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{opacity:.45;cursor:not-allowed}

.result{margin-top:16px}
.msg{
  padding:16px;border-radius:14px;font-size:17px;
  background:#2A1A1A;border:1px solid var(--danger);color:#F3C9C2;
}
/* تنبيهٌ رمليّ — أخفُّ من رسالةِ الخطأ: الكتابُ سليمٌ لكنّه لم يُطرحْ بعد */
.note{
  margin-top:10px;padding:14px 16px;border-radius:14px;font-size:16px;
  background:#241D0E;border:1px solid var(--stone);color:var(--stone-soft);
}
select option:disabled{color:var(--muted)}

/* التوقيع: الرمز محفور على شظيّة قمرية */
.code-card{
  padding:26px 20px;border-radius:18px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%, #2B3242 0%, #141A24 70%);
  border:1px solid var(--stone);
  animation:rise .55s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.code-card .cap{color:var(--ok);font-size:16px}
.code{
  font-family:ui-monospace,monospace;font-size:34px;font-weight:700;
  letter-spacing:3px;color:var(--stone-soft);margin:12px 0 6px;
  word-break:break-all;
}
.expires{color:var(--muted);font-size:15px}
.code-actions{display:flex;gap:10px;margin-top:18px}
.code-actions button{flex:1;padding:13px;border-radius:12px;font:inherit;font-size:16px;cursor:pointer}
.btn-open{background:var(--moon);color:#141A24;border:0;font-weight:700}
.btn-copy{background:transparent;color:var(--moon);border:1px solid var(--line)}

.spin{display:inline-block;width:17px;height:17px;vertical-align:-3px;
  border:2px solid rgba(0,0,0,.25);border-top-color:#1A1206;border-radius:50%;
  animation:spin .7s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="wrap">
  <a class="back" href="index.html">→ رجوع للرئيسة</a>
  <h1>فتح كتاب</h1>
  <p class="sub">حوّلي المبلغ، ارفعي الإيصال، ويظهر الرمز أمامك مباشرة.</p>

  <!-- ١ -->
  <div class="step">
    <div class="step-head"><div class="step-num">١</div><div class="step-title">اختاري الكتاب وحوّلي المبلغ</div></div>

    <label for="book">الكتاب</label>
    <select id="book"><option>جارٍ تحميل قائمة الكتب…</option></select>
    <div id="bookNote"></div>

    <div class="amount"><span>المبلغ المطلوب</span><b id="price">—</b></div>

    <div class="acct">
      <label>حوّلي إلى</label>
      <div class="acct-row"><span id="acctNo"></span><button class="copy" data-copy="acctNo">نسخ</button></div>
      <div class="acct-row"><span id="acctName"></span></div>
    </div>
  </div>

  <!-- ٢ -->
  <div class="step">
    <div class="step-head"><div class="step-num">٢</div><div class="step-title">ارفعي إيصال التحويل</div></div>

    <div class="drop" id="drop" role="button" tabindex="0">
      <div id="dropMain">اضغطي لاختيار ملف الإيصال</div>
      <div class="drop-hint">ملف PDF من تطبيق البنك — لا صورة من المعرض</div>
    </div>
    <input type="file" id="file" accept="application/pdf">

    <label for="phone">رقم هاتفك</label>
    <input type="tel" id="phone" inputmode="numeric" placeholder="٩٦٨ ٠٠٠٠٠٠٠٠">

    <label for="name">اسمك (اختياري)</label>
    <input type="text" id="name" placeholder="للسجلّ فقط">
  </div>

  <!-- ٣ -->
  <div class="step">
    <div class="step-head"><div class="step-num">٣</div><div class="step-title">استلمي الرمز</div></div>
    <button class="go" id="go" disabled>تحقّقي من الدفع</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
/* ═══════════ CONFIG — عدّلي هذه القيم ═══════════ */
const CONFIG = {
  WEBHOOK : "https://shoogp.app.n8n.cloud/webhook/activate",
  PRICE   : 1,
  ACCOUNT : "91496256",   // ← رقم الحساب أو رقم الهاتف للتحويل
  HOLDER  : "IBRAHIM KHAMIS — بنك مسقط",
  /* الكتبُ المطروحةُ للبيعِ اليوم. وما عداها من كتبِ `data/books.json` يظهرُ
     في القائمةِ بكلمةِ «قريباً» معطَّلاً — فالقائمةُ كاملةٌ والبيعُ محدود. */
  ON_SALE : ["g1-sci", "g2-sci", "g3-sci", "g4-sci"]
};
/* قائمةُ الكتبِ تُقرأُ من `data/books.json` — مصدرُ بطاقاتِ المنصّةِ نفسُه،
   فلا تتفرّقُ نسختانِ ولا يُنسى كتابٌ جديدٌ هنا بعدَ إضافتِه هناك. */
const BOOKS_URL = "data/books.json";
/* ═══════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const arNum = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
/* تمييزُ الريالِ يتبعُ العدد: ١ ريالٌ واحد · ٢ ريالان · ٣–١٠ ريالات · ما فوقُ ريالاً */
const riyal = n =>
  n === 1 ? "ريال واحد" :
  n === 2 ? "ريالان" :
  n <= 10 ? arNum(n) + " ريالات" : arNum(n) + " ريالاً";

$("price").textContent = riyal(CONFIG.PRICE);
$("acctNo").textContent = CONFIG.ACCOUNT;
$("acctName").textContent = CONFIG.HOLDER;

/* ═══════════ قائمةُ الكتب ═══════════ */
const wanted = new URLSearchParams(location.search).get("book");
let books = [];      // [{id,name}] بترتيبِ `data/books.json`
let blocked = "";    // سببُ منعِ التحقّق (كتابٌ غيرُ مطروحٍ أو قائمةٌ لم تُحمَّل)

/* اسمُ العرض: العنوانُ وحدَه لا يكفي — «أحب لغتي» جزآنِ في كلِّ صف،
   فيُضافُ الجزءُ من لاحقةِ المفتاحِ ثمّ الصفُّ من مفتاحِ التجميعِ في الملف. */
function bookLabel(b, grade){
  const part = /-1$/.test(b.key) ? " (الجزء الأول)"
             : /-2$/.test(b.key) ? " (الجزء الثاني)" : "";
  return b.title + part + " — الصف " + grade;
}

/* الملفُّ مُبوَّبٌ: فصلٌ دراسيّ ← صفّ ← مصفوفةُ كتب. نسطّحُه محافظينَ على ترتيبِه. */
function flatten(data){
  const out = [], seen = new Set();
  Object.values(data).forEach(grades =>
    Object.entries(grades).forEach(([grade, list]) =>
      (list || []).forEach(b => {
        if (!b || !b.key || seen.has(b.key)) return;
        seen.add(b.key);
        out.push({ id:b.key, name:bookLabel(b, grade) });
      })));
  return out;
}

function fillBooks(){
  $("book").innerHTML = books.map(b => {
    const on = CONFIG.ON_SALE.includes(b.id);
    return `<option value="${b.id}"${on ? "" : " disabled"}>${b.name}${on ? "" : " — قريباً"}</option>`;
  }).join("");
  // المتصفّحُ يختارُ أوّلَ خيارٍ غيرِ معطَّل، فلا تبدأُ الصفحةُ على كتابٍ غيرِ مطروح
}

function note(html){ $("bookNote").innerHTML = html ? `<div class="note">${html}</div>` : ""; }

/* الكتابُ المطلوبُ في الرابط: إن لم يكن مطروحاً نُنبّهُ ونمنعُ التحقّق —
   وينفكُّ المنعُ إن اختارتِ المعلّمةُ كتاباً آخرَ من القائمة. */
function applyWanted(){
  if (!wanted) return;
  const b = books.find(x => x.id === wanted);
  if (!b){
    blocked = "لم نجد هذا الكتاب في قائمة كتب المنصّة. اختاري كتاباً من القائمة أعلاه.";
  } else if (!CONFIG.ON_SALE.includes(wanted)){
    blocked = `«${b.name}» لم يُطرح للبيع بعد. اختاري كتاباً آخر من القائمة، أو عودي إلينا قريباً.`;
  } else {
    $("book").value = wanted;
  }
  note(blocked);
}

$("book").onchange = () => { if (blocked){ blocked = ""; note(""); } check(); };

fetch(BOOKS_URL)
  .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(data => { books = flatten(data); fillBooks(); applyWanted(); check(); })
  .catch(() => {
    blocked = "تعذّر تحميل قائمة الكتب. تأكّدي من الإنترنت وأعيدي تحميل الصفحة.";
    $("book").innerHTML = '<option>—</option>';
    note(blocked); check();
  });

document.querySelectorAll(".copy").forEach(btn => {
  btn.onclick = async () => {
    await navigator.clipboard.writeText($(btn.dataset.copy).textContent.trim());
    const old = btn.textContent; btn.textContent = "تم النسخ";
    setTimeout(() => btn.textContent = old, 1600);
  };
});

/* اختيار الملف */
const drop = $("drop"), fileInput = $("file");
drop.onclick = () => fileInput.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } };
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) { fileInput.files = e.dataTransfer.files; onPick(); } });
fileInput.onchange = onPick;

function onPick(){
  const f = fileInput.files[0];
  if (!f) return;
  if (f.type !== "application/pdf"){
    show(`<div class="msg">الملف ليس PDF. افتحي إشعار التحويل في تطبيق البنك واختاري «مشاركة» ثم احفظيه ملفاً.</div>`);
    fileInput.value = ""; return;
  }
  drop.classList.add("filled");
  $("dropMain").textContent = f.name;
  $("result").innerHTML = "";
  check();
}

/* تفعيل الزر */
$("phone").oninput = check;
function check(){
  const phoneOk = $("phone").value.replace(/\D/g,"").length >= 8;
  const bookOk  = !blocked && CONFIG.ON_SALE.includes($("book").value);
  $("go").disabled = !(bookOk && fileInput.files[0] && phoneOk);
}

function show(html){ $("result").innerHTML = html; }

/* الإرسال */
$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = 'جارٍ التحقّق<span class="spin"></span>';
  show("");

  const fd = new FormData();
  fd.append("receipt", fileInput.files[0]);
  fd.append("scope", $("book").value);
  fd.append("phone", $("phone").value.replace(/\D/g,""));
  fd.append("name",  $("name").value);

  try{
    const res  = await fetch(CONFIG.WEBHOOK, { method:"POST", body: fd });
    const data = await res.json();

    if (data.ok){
      show(`
        <div class="code-card">
          <div class="cap">تم التحقّق من الدفع</div>
          <div class="code" id="theCode">${data.code}</div>
          <div class="expires">صالح حتى ${data.expires || "—"}</div>
          <div class="code-actions">
            <button class="btn-open" id="useIt">افتحي الكتاب الآن</button>
            <button class="btn-copy" data-copy2="theCode">نسخ الرمز</button>
          </div>
        </div>`);
      $("useIt").onclick = () => unlockNow(data.code);
      document.querySelector("[data-copy2]").onclick = async e => {
        await navigator.clipboard.writeText(data.code);
        e.target.textContent = "تم النسخ";
      };
    } else {
      show(`<div class="msg">${data.message || "تعذّر التحقّق من الإيصال."}</div>`);
    }
  } catch(err){
    show(`<div class="msg">انقطع الاتصال قبل أن يكتمل التحقّق. تأكّدي من الشبكة وأعيدي المحاولة — لن يُخصم منك شيء إضافي.</div>`);
  } finally{
    btn.disabled = false;
    btn.textContent = "تحقّقي من الدفع";
    check();
  }
};

/* الوصل بنظام القفل القائم — يستبدله كلود كود باستدعاء redeem() مباشرة */
function unlockNow(code){
  if (window.Unlock && typeof window.Unlock.redeem === "function") {
    window.Unlock.redeem(code);
  } else {
    location.href = "/?code=" + encodeURIComponent(code);
  }
}
</script>
</body>
</html>
