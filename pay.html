<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شراء الكتب — شوجب</title>

<!--
  ═══════════════════════════════════════════════════════════════
  سلّةُ شراءٍ متعدّدةُ الكتب. **ترتيبُ الشاشةِ قاعدةٌ لا تنسيق:**
  المبلغُ ورقمُ الحسابِ وخانةُ الإيصالِ **لا تظهرُ قبلَ تأكيدِ الطلب** —
  فلا تُحوِّلُ المعلّمةُ مبلغَ كتابٍ واحدٍ ثمّ تضيفُ كتاباً آخر.
  المطلوبُ تعديلُه قبلَ التشغيل: قسمُ CONFIG أسفلَ الصفحة.
  ═══════════════════════════════════════════════════════════════
-->

<style>
:root{
  --space:#0F131B;          /* خلفية الفضاء */
  --panel:#171D28;          /* جسم اللوحة */
  --stone:#C9A227;          /* رمليّ — نفس لون قفل الشراء */
  --stone-soft:#E3C766;
  --moon:#EDE8DE;           /* أبيض القمر */
  --muted:#8A93A3;
  --line:#242C3A;
  --danger:#E0705F;
  --ok:#5FBF8B;
}
*{box-sizing:border-box}
body{
  margin:0; padding:32px 16px; min-height:100vh;
  background:var(--space);
  color:var(--moon);
  font-family:"Tajawal","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  font-size:18px; line-height:1.9;
}
.wrap{max-width:560px;margin:0 auto}
/* رابطُ العودة — بهيئةِ زرِّ الرجوعِ في المنصّة (`.back` في css/style.css) */
.back{
  display:inline-block;margin:0 0 18px;padding:10px 18px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:16px;text-decoration:none;
}
.back:hover{background:rgba(255,255,255,.2)}
h1{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:16px;margin:0 0 28px}

.step{
  background:var(--panel); border:1px solid var(--line);
  border-radius:18px; padding:22px; margin-bottom:16px;
}
.step[hidden]{display:none}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-num{
  width:30px;height:30px;flex:none;border-radius:50%;
  background:var(--stone);color:#1A1206;
  display:grid;place-items:center;font-weight:700;font-size:16px;
}
.step-title{font-weight:700;font-size:19px}

label{display:block;font-size:16px;color:var(--muted);margin:14px 0 6px}
select,input[type=text],input[type=tel]{
  width:100%;padding:14px;border-radius:12px;
  background:#0D111A;border:1px solid var(--line);
  color:var(--moon);font:inherit;font-size:17px;
}
select:focus,input:focus,button:focus-visible,a:focus-visible{
  outline:2px solid var(--stone-soft);outline-offset:2px;
}
select:disabled{opacity:.5;cursor:not-allowed}

/* ═══════════ السلّة ═══════════ */
/* البطاقةُ المثبّتة: الكتابُ الذي جاءت من أجلِه (من `?book`) — لا يُحذَف */
.pin{
  display:flex;align-items:center;gap:12px;
  padding:16px 18px;border-radius:14px;
  background:linear-gradient(180deg,#1D2637,#141A24);
  border:1px solid var(--stone);
}
.pin .ic{font-size:22px;line-height:1}
.pin .nm{flex:1;font-weight:700}
.pin .tag{font-size:14px;color:var(--stone-soft);white-space:nowrap}

.cart{margin-top:10px}
.cart-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:12px;margin-top:8px;
  background:#0D111A;border:1px solid var(--line);
}
.cart-item .nm{flex:1;font-size:17px}
.cart-del{
  flex:none;min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--line);color:var(--danger);
  border-radius:10px;font:inherit;font-size:18px;line-height:1;cursor:pointer;
}
.cart-del:hover{border-color:var(--danger);background:rgba(224,112,95,.1)}

/* السلّةُ بعدَ التأكيد: رماديةٌ مقفلةٌ لا تُلمَس */
.locked .pin,.locked .cart-item{opacity:.55;filter:grayscale(.6)}
.locked .pin{border-color:var(--line)}

.addrow{display:flex;gap:10px;align-items:stretch;margin-top:10px}
.addrow select{flex:1}
.addbtn{
  flex:none;padding:0 20px;border-radius:12px;
  background:transparent;border:1px solid var(--stone);color:var(--stone-soft);
  font:inherit;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.addbtn:hover:not(:disabled){background:rgba(201,162,39,.12)}
.addbtn:disabled{opacity:.4;cursor:not-allowed}

.hintline{margin:16px 0 0;color:var(--muted);font-size:16px;text-align:center}

.confirm{
  width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;
  background:var(--stone);color:#1A1206;font:inherit;font-weight:700;font-size:19px;
  cursor:pointer;transition:filter .18s;
}
.confirm:hover:not(:disabled){filter:brightness(1.08)}
.confirm:disabled{opacity:.45;cursor:not-allowed}
.edit{
  width:100%;margin-top:14px;padding:14px;border-radius:14px;
  background:transparent;border:1px solid var(--line);color:var(--moon);
  font:inherit;font-size:17px;cursor:pointer;
}
.edit:hover{border-color:var(--stone)}

.amount{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding:14px 16px;border-radius:12px;
  background:#0D111A;border:1px dashed var(--line);
}
.amount b{font-size:24px;color:var(--stone-soft)}
.amount-calc{margin:6px 2px 0;color:var(--muted);font-size:15px}

.acct{margin-top:12px}
.acct-row{
  display:flex;align-items:center;gap:8px;
  background:#0D111A;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-top:8px;
}
.acct-row span{flex:1;font-family:ui-monospace,monospace;font-size:17px;letter-spacing:.5px}
.copy{
  background:transparent;border:1px solid var(--line);color:var(--stone-soft);
  border-radius:9px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;
}
.copy:hover{border-color:var(--stone)}

.drop{
  margin-top:6px;border:2px dashed var(--line);border-radius:14px;
  padding:24px 16px;text-align:center;cursor:pointer;
  transition:border-color .18s, background .18s;
}
.drop:hover,.drop.over{border-color:var(--stone);background:#0D111A}
.drop.filled{border-style:solid;border-color:var(--ok)}
.drop-hint{color:var(--muted);font-size:15px;margin-top:4px}
input[type=file]{display:none}

.go{
  width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;
  background:var(--stone);color:#1A1206;font:inherit;font-weight:700;font-size:19px;
  cursor:pointer;transition:filter .18s;
}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{opacity:.45;cursor:not-allowed}

.result{margin-top:16px}
.msg{
  padding:16px;border-radius:14px;font-size:17px;
  background:#2A1A1A;border:1px solid var(--danger);color:#F3C9C2;
}
/* تنبيهٌ رمليّ — أخفُّ من رسالةِ الخطأ: أمرٌ سليمٌ يحتاجُ انتباهاً لا تصحيحاً */
.note{
  margin-top:10px;padding:14px 16px;border-radius:14px;font-size:16px;
  background:#241D0E;border:1px solid var(--stone);color:var(--stone-soft);
}
select option:disabled{color:var(--muted)}

/* التوقيع: الرمز محفور على شظيّة قمرية — بطاقةٌ لكلِّ كتاب */
.code-card{
  padding:22px 20px;border-radius:18px;text-align:center;margin-top:14px;
  background:radial-gradient(120% 90% at 50% 0%, #2B3242 0%, #141A24 70%);
  border:1px solid var(--stone);
  animation:rise .55s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.code-card .cap{color:var(--ok);font-size:16px}
.code-book{font-size:17px;font-weight:700;margin-bottom:2px}
.code{
  font-family:ui-monospace,monospace;font-size:30px;font-weight:700;
  letter-spacing:3px;color:var(--stone-soft);margin:10px 0 6px;
  word-break:break-all;
}
.expires{color:var(--muted);font-size:15px}
.btn-copy{
  width:100%;margin-top:14px;padding:13px;border-radius:12px;
  background:transparent;color:var(--moon);border:1px solid var(--line);
  font:inherit;font-size:16px;cursor:pointer;
}
.btn-copy:hover{border-color:var(--stone)}
/* الفعلُ الوحيدُ هنا نسخٌ ولصق، والسطرُ يقولُ أينَ يُلصَق */
.code-hint{margin:14px 0 0;color:var(--muted);font-size:14px;text-align:center}

.spin{display:inline-block;width:17px;height:17px;vertical-align:-3px;
  border:2px solid rgba(0,0,0,.25);border-top-color:#1A1206;border-radius:50%;
  animation:spin .7s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<div class="wrap">
  <a class="back" href="index.html">→ رجوع للرئيسة</a>
  <h1>شراء الكتب</h1>
  <p class="sub">أضيفي كتبك، أكّدي الطلب، حوّلي المبلغ وارفعي الإيصال.</p>

  <!-- ① السلّة -->
  <div class="step" id="step1">
    <div class="step-head"><div class="step-num">١</div><div class="step-title">كتبك</div></div>

    <div id="cartWrap">
      <div id="pinned"></div>
      <div class="cart" id="cartList"></div>
    </div>

    <div id="addWrap">
      <label for="addSel">إضافة كتاب آخر</label>
      <div class="addrow">
        <select id="addSel"><option>جارٍ تحميل قائمة الكتب…</option></select>
        <button class="addbtn" id="addBtn" disabled>إضافة</button>
      </div>
    </div>

    <div id="cartNote"></div>

    <p class="hintline" id="preHint">أضيفي كل الكتب، ثم أكّدي الطلب ليظهر المبلغ</p>
    <button class="confirm" id="confirmBtn" disabled>تأكيد الطلب</button>
    <button class="edit" id="editBtn" hidden>تعديل الطلب</button>
  </div>

  <!-- ② المبلغ والحساب — لا يظهران قبل التأكيد -->
  <div class="step" id="step2" hidden>
    <div class="step-head"><div class="step-num">٢</div><div class="step-title">حوّلي المبلغ</div></div>

    <div class="amount"><span>المبلغ المطلوب</span><b id="price">—</b></div>
    <p class="amount-calc" id="calc"></p>

    <div class="acct">
      <label>حوّلي إلى</label>
      <div class="acct-row"><span id="acctNo"></span><button class="copy" data-copy="acctNo">نسخ</button></div>
      <div class="acct-row"><span id="acctName"></span></div>
    </div>
  </div>

  <!-- ③ الإيصال — لا يظهر قبل التأكيد -->
  <div class="step" id="step3" hidden>
    <div class="step-head"><div class="step-num">٣</div><div class="step-title">ارفعي إيصال التحويل</div></div>

    <div class="drop" id="drop" role="button" tabindex="0">
      <div id="dropMain">اضغطي لاختيار ملف الإيصال</div>
      <div class="drop-hint">ملف PDF من تطبيق البنك، أو صورة الإيصال</div>
    </div>
    <!-- PDF أو صورة — كما في مسارِ الواتساب: الصورةُ تُقرأُ بجيميناي في مسارِ التفعيل -->
    <input type="file" id="file" accept="application/pdf,image/*">

    <!-- الرقمُ اختياريٌّ (قرارُ المالك ٢٠٢٦-٠٩-٠٣): كان إجبارياً لأنّه ما يملأُ عمودَ
         «سُلّم إلى» في جدولِ الرموز — فبه يُعدُّ الرمزُ مأخوذاً ولا يُعادُ بيعُه. والآن
         يملؤُه مسارُ «التفعيل من الموقع» بالاسمِ، وإلا بالرقمِ، وإلا بالمرجعِ البنكيِّ
         — فلا يفرغُ أبداً. ومن تركَت الرقمَ لا سبيلَ إلى مبادرتِها بالتواصل، ويُطلَبُ
         منها الإيصالُ حينَ تراجع. ولا يُرسَلُ إلى الرقمِ شيء. -->
    <label for="phone">رقم هاتفك (اختياري — يُحفظ مع رمزك حتى نجده لكِ إن ضاع، ولا نرسل إليه شيئاً)</label>
    <input type="tel" id="phone" inputmode="numeric" placeholder="٩٦٨ ٠٠٠٠٠٠٠٠">

    <label for="name">اسمك (اختياري)</label>
    <input type="text" id="name" placeholder="للسجلّ فقط">

    <button class="go" id="go" disabled>تحقّقي من الدفع</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
/* ═══════════ CONFIG — عدّلي هذه القيم ═══════════ */
const CONFIG = {
  WEBHOOK : "https://shoogp.app.n8n.cloud/webhook/activate",
  PRICE   : 3,            // سعرُ **الكتابِ الواحد** — والمجموعُ يُضرَبُ بعددِ كتبِ السلّة
  ACCOUNT : "91496256",   // ← رقم الحساب أو رقم الهاتف للتحويل
  HOLDER  : "IBRAHIM KHAMIS — بنك مسقط",
};
/* ═══ ما يُطرَحُ للبيعِ لا يُكتَبُ هنا ═══
   `onSale` يسكنُ البياناتِ نفسَها: `data/books.json` للكتابِ المستقلّ، و
   `data/bundles.json` للحزمة. فطرحُ كتابٍ أو سحبُه تعديلُ حقلٍ واحدٍ حيثُ
   يُعرَّفُ الكتابُ أصلاً، لا قائمةٌ ثانيةٌ هنا تُنسى عندَ إضافةِ كتابٍ جديد.
   ⚠️ **وهو خاصّيةُ الوحدةِ القابلةِ للبيعِ لا خاصّيةُ كلِّ كتاب:** جزءُ الحزمةِ
   (`g1-dini-1`) **لا يحملُه إطلاقاً** — لا يُباعُ وحدَه، فحالتُه حالةُ حزمتِه.
   يحرسُ هذه البنيةَ `tools/check-data-sync.mjs`. */
/* قائمةُ الكتبِ تُقرأُ من `data/books.json` — مصدرُ بطاقاتِ المنصّةِ نفسُه،
   فلا تتفرّقُ نسختانِ ولا يُنسى كتابٌ جديدٌ هنا بعدَ إضافتِه هناك. */
const BOOKS_URL = "data/books.json";
/* والحزمُ من `data/bundles.json` — المصدرُ نفسُه الذي يقرأُه `js/unlock.js`. */
const BUNDLES_URL = "data/bundles.json";
/* ═══════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const arNum = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
/* تمييزُ الريالِ يتبعُ العدد: ١ ريالٌ واحد · ٢ ريالان · ٣–١٠ ريالات · ما فوقُ ريالاً */
const riyal = n =>
  n === 1 ? "ريال واحد" :
  n === 2 ? "ريالان" :
  n <= 10 ? arNum(n) + " ريالات" : arNum(n) + " ريالاً";
/* تمييزُ الكتابِ كذلك — «كتابٌ واحد» لا «١ كتب» */
const kitab = n =>
  n === 1 ? "كتاب واحد" :
  n === 2 ? "كتابان" :
  n <= 10 ? arNum(n) + " كتب" : arNum(n) + " كتاباً";

$("acctNo").textContent = CONFIG.ACCOUNT;
$("acctName").textContent = CONFIG.HOLDER;

/* ═══════════ الحالة ═══════════ */
let books = [];        // [{id,name}] بترتيبِ `data/books.json`
let cart = [];         // مفاتيحُ كتبِ السلّةِ بالترتيب
let pinned = null;     // الكتابُ المثبَّتُ من `?book` — بطاقةٌ في الأعلى لا تُحذَف
let confirmed = false; // بعدَ التأكيدِ تُقفَلُ السلّةُ ويظهرُ المبلغُ والحساب
let fatal = "";        // عطبٌ يمنعُ الطلبَ كلَّه (تعذّرت قائمةُ الكتبِ مثلاً)

const nameOf = id => (books.find(b => b.id === id) || {}).name || id;

/* اسمُ العرض: العنوانُ وحدَه لا يكفي — «أحب لغتي» جزآنِ في كلِّ صف،
   فيُضافُ الجزءُ من لاحقةِ المفتاحِ ثمّ الصفُّ من مفتاحِ التجميعِ في الملف. */
function bookLabel(b, grade){
  const part = /-1$/.test(b.key) ? " (الجزء الأول)"
             : /-2$/.test(b.key) ? " (الجزء الثاني)" : "";
  return b.title + part + " — الصف " + grade;
}

/* الملفُّ مُبوَّبٌ: فصلٌ دراسيّ ← صفّ ← مصفوفةُ كتب. نسطّحُه محافظينَ على ترتيبِه. */
function flatten(data){
  const out = [], seen = new Set();
  Object.values(data).forEach(grades =>
    Object.entries(grades).forEach(([grade, list]) =>
      (list || []).forEach(b => {
        if (!b || !b.key || seen.has(b.key)) return;
        seen.add(b.key);
        out.push({ id:b.key, name:bookLabel(b, grade), onSale:b.onSale === true });
      })));
  return out;
}

/* ═══ طيُّ الحزمِ: الجزآنِ سطرٌ واحدٌ في القائمة ═══
   «ديني حياتي» و«أحب لغتي» جزآنِ في `data/books.json`، وهما في البيعِ كتابٌ
   واحدٌ بثمنٍ واحدٍ ورمزٍ واحد. فيُستبدَلُ **أوّلُ** جزءٍ بسطرِ الحزمةِ — محافظةً
   على ترتيبِ القائمةِ الأصليّ — ويُحذَفُ بقيّةُ الأجزاء.
   والاسمُ بلا «(الجزء الأول)» لأنّ الشراءَ يفتحُهما معاً. */
function collapseBundles(list, bundles){
  const memberOf = new Map();   // مفتاحُ الجزءِ ← مفتاحُ الحزمة
  Object.entries(bundles || {}).forEach(([id, b]) =>
    (b.members || []).forEach(m => memberOf.set(m, id)));
  if (!memberOf.size) return list;

  const out = [], placed = new Set();
  list.forEach(item => {
    const bid = memberOf.get(item.id);
    if (!bid){ out.push(item); return; }
    if (placed.has(bid)) return;               // جزءٌ تالٍ لحزمةٍ وُضِعت — يُطوى
    placed.add(bid);
    const b = bundles[bid];
    out.push({ id: bid, name: b.title + " — الصف " + b.grade,
               members: b.members.slice(), onSale: b.onSale === true });
  });
  return out;
}

/* مفتاحُ الشراءِ من أيِّ مفتاح: `?book=g1-dini-1` القادمُ من نافذةِ القفلِ في
   `js/unlock.js` يصيرُ `g1-din` — فتفتحُ الصفحةُ على الحزمةِ لا على جزءٍ لا يُباعُ وحدَه. */
function saleIdOf(key){
  const hit = books.find(b => b.id === key
                           || (b.members && b.members.indexOf(key) !== -1));
  return hit ? hit.id : key;
}

/* «أمطروحٌ؟» للوحدةِ (كتابٌ مستقلٌّ أو حزمة) — بعدَ الطيّ، فالمُسأَلُ عنه دائماً
   مفتاحُ وحدةٍ لا مفتاحُ جزء. وغيابُ الوحدةِ = ليس مطروحاً (لا استثناء). */
function isOnSale(id){
  const u = books.find(b => b.id === id);
  return !!(u && u.onSale);
}

function note(html){ $("cartNote").innerHTML = html ? `<div class="note">${html}</div>` : ""; }

/* ═══════════ الرسم ═══════════ */
function render(){
  // ① البطاقةُ المثبّتة
  $("pinned").innerHTML = pinned
    ? `<div class="pin"><span class="ic">📘</span>
         <span class="nm">${nameOf(pinned)}</span>
         <span class="tag">كتابك</span></div>`
    : "";

  // ② بقيّةُ السلّة — سطرٌ وزرُّ حذفٍ لكلِّ كتابٍ مضاف
  const rest = cart.filter(id => id !== pinned);
  $("cartList").innerHTML = rest.map(id =>
    `<div class="cart-item"><span class="nm">${nameOf(id)}</span>` +
    (confirmed ? "" : `<button class="cart-del" data-del="${id}" aria-label="حذف ${nameOf(id)}">✕</button>`) +
    `</div>`).join("");
  $("cartList").querySelectorAll("[data-del]").forEach(b =>
    b.onclick = () => { cart = cart.filter(x => x !== b.dataset.del); afterCartChange(); });

  // ③ قائمةُ الإضافة: المطروحُ فقط، وبلا ما في السلّةِ أصلاً
  const avail = books.filter(b => b.onSale && !cart.includes(b.id));
  $("addSel").innerHTML = avail.length
    ? avail.map(b => `<option value="${b.id}">${b.name}</option>`).join("")
    : `<option>لا كتبَ أخرى متاحةً الآن</option>`;
  $("addSel").disabled = !avail.length || !!fatal;
  $("addBtn").disabled = !avail.length || !!fatal;
  $("addWrap").hidden = confirmed;

  // ④ قفلُ السلّةِ بعدَ التأكيد
  $("cartWrap").classList.toggle("locked", confirmed);

  // ⑤ الترتيبُ الحاسم: لا مبلغَ ولا حسابَ ولا إيصالَ قبلَ التأكيد
  $("preHint").hidden   = confirmed;
  $("confirmBtn").hidden = confirmed;
  $("editBtn").hidden    = !confirmed;
  $("step2").hidden      = !confirmed;
  $("step3").hidden      = !confirmed;
  $("confirmBtn").disabled = !cart.length || !!fatal;

  if (confirmed){
    $("price").textContent = riyal(CONFIG.PRICE * cart.length);
    $("calc").textContent  = `${riyal(CONFIG.PRICE)} × ${kitab(cart.length)}`;
  }
  check();
}

/* كلُّ تغيّرٍ في السلّةِ يُعيدُ الرسم */
function afterCartChange(){ render(); }

$("addBtn").onclick = () => {
  const id = $("addSel").value;
  if (!id || cart.includes(id) || !isOnSale(id)) return;
  cart.push(id);
  note("");
  afterCartChange();
};

$("confirmBtn").onclick = () => { confirmed = true; note(""); render(); };

$("editBtn").onclick = () => {
  confirmed = false;
  render();
  note("لا تحوّلي قبل تأكيد الطلب — المبلغ يتغيّر مع كل كتاب تضيفينه.");
};

/* ═══════════ الإقلاع: قراءةُ `?book=` المتعدّد ═══════════
   الفصلُ بفاصلة، وأوّلُ مفتاحٍ صالحٍ يصيرُ **البطاقةَ المثبّتة**. */
const wantedRaw = new URLSearchParams(location.search).get("book") || "";
const wantedIds = wantedRaw.split(",").map(s => s.trim()).filter(Boolean);

function applyWanted(){
  if (!wantedIds.length) return;
  const unknown = [], soon = [];
  wantedIds.forEach(raw => {
    const id = saleIdOf(raw);          // جزءٌ من حزمةٍ ⇒ مفتاحُ الحزمة
    const b = books.find(x => x.id === id);
    if (!b) { unknown.push(raw); return; }
    if (!b.onSale) { soon.push(b.name); return; }
    if (!cart.includes(id)) cart.push(id);
  });
  if (cart.length) pinned = cart[0];

  const msgs = [];
  if (soon.length)    msgs.push(`«${soon.join("»، «")}» لم يُطرح للبيع بعد، فلم يُضَف إلى الطلب.`);
  if (unknown.length) msgs.push(`لم نجد في قائمة كتب المنصّة: ${unknown.join("، ")}.`);
  if (!cart.length)   msgs.push("أضيفي كتاباً من القائمة أدناه لتبدأي.");
  note(msgs.join(" "));
}

Promise.all([
  fetch(BOOKS_URL).then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); }),
  // غيابُ ملفِّ الحزمِ لا يُسقِطُ الصفحة: تُعرَضُ الأجزاءُ كلٌّ على حدةٍ كما كانت
  fetch(BUNDLES_URL).then(r => r.ok ? r.json() : {}).catch(() => ({}))
])
  // الرسمُ بعدَ وصولِ القائمةِ لا قبلَها — قبلَها لا أسماءَ للمفاتيحِ أصلاً
  .then(([data, bundles]) => {
    books = collapseBundles(flatten(data), bundles);
    applyWanted(); afterCartChange();
  })
  .catch(() => {
    fatal = "تعذّر تحميل قائمة الكتب. تأكّدي من الإنترنت وأعيدي تحميل الصفحة.";
    render(); note(fatal);
  });

document.querySelectorAll(".copy").forEach(btn => {
  btn.onclick = async () => {
    try{
      await navigator.clipboard.writeText($(btn.dataset.copy).textContent.trim());
      const old = btn.textContent; btn.textContent = "تم النسخ";
      setTimeout(() => btn.textContent = old, 1600);
    }catch(e){ btn.textContent = "انسخيه يدوياً"; }
  };
});

/* ═══════════ اختيار الملف ═══════════ */
const drop = $("drop"), fileInput = $("file");
drop.onclick = () => fileInput.click();
drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } };
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) { fileInput.files = e.dataTransfer.files; onPick(); } });
fileInput.onchange = onPick;

function onPick(){
  const f = fileInput.files[0];
  if (!f) return;
  const isPdf = f.type === "application/pdf";
  const isImg = /^image\//.test(f.type);
  if (!isPdf && !isImg){
    show(`<div class="msg">الملف ليس PDF ولا صورة. افتحي إشعار التحويل في تطبيق البنك واختاري «مشاركة» ثم احفظيه ملفاً، أو صوّري الإيصال.</div>`);
    fileInput.value = ""; return;
  }
  drop.classList.add("filled");
  $("dropMain").textContent = f.name;
  $("result").innerHTML = "";
  check();
}

/* تفعيل الزر — التحقّقُ لا يُتاحُ إلا بعدَ التأكيدِ وبسلّةٍ غيرِ فارغة.
   والرقمُ اختياريّ: فارغٌ يُقبَل، وإن كُتِبَ فثماني خاناتٍ فأكثر. */
$("phone").oninput = check;
function check(){
  const digits = $("phone").value.replace(/\D/g,"").length;
  const phoneOk = digits === 0 || digits >= 8;
  $("go").disabled = !(confirmed && cart.length && !fatal && fileInput.files[0] && phoneOk);
}

function show(html){ $("result").innerHTML = html; }

/* ═══════════ الإرسال ═══════════ */
$("go").onclick = async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = 'جارٍ التحقّق<span class="spin"></span>';
  show("");

  const fd = new FormData();
  fd.append("receipt", fileInput.files[0]);
  fd.append("scope", cart.join(","));      // مفاتيحُ السلّةِ في قيمةٍ واحدة
  fd.append("phone", $("phone").value.replace(/\D/g,""));
  fd.append("name",  $("name").value);

  try{
    const res  = await fetch(CONFIG.WEBHOOK, { method:"POST", body: fd });
    const data = await res.json();

    if (data.ok){
      /* الردُّ `codes` مصفوفةُ {scope, code, expires} — بطاقةٌ لكلِّ كتاب.
         والصيغةُ المفردةُ القديمةُ (`code`) تُقبَلُ ولا تُسقِطُ الردَّ. */
      const list = Array.isArray(data.codes) && data.codes.length ? data.codes
                 : (data.code ? [{ scope: cart[0], code: data.code, expires: data.expires }] : []);
      if (!list.length){
        show(`<div class="msg">تمّ التحقّق لكن لم تصلْنا الرموز. تواصلي معنا ومعك رقم هاتفك.</div>`);
        return;
      }
      show(
        `<div class="code-card"><div class="cap">تم التحقّق من الدفع</div></div>` +
        list.map((c,i) =>
          `<div class="code-card">
             <div class="code-book">${nameOf(c.scope)}</div>
             <div class="code" id="code${i}">${c.code}</div>
             <div class="expires">صالح حتى ${c.expires || "—"}</div>
             <button class="btn-copy" data-code="${i}">نسخ الرمز</button>
           </div>`).join("") +
        `<p class="code-hint">انسخي كل رمز والصقيه في خانة فتح الكتاب الخاص به</p>`
      );
      $("result").querySelectorAll("[data-code]").forEach(b =>
        b.onclick = async () => {
          try{
            await navigator.clipboard.writeText(list[+b.dataset.code].code);
            b.textContent = "تم النسخ";
          }catch(e){ b.textContent = "انسخيه يدوياً"; }
        });
    } else {
      show(`<div class="msg">${data.message || "تعذّر التحقّق من الإيصال."}</div>`);
    }
  } catch(err){
    show(`<div class="msg">انقطع الاتصال قبل أن يكتمل التحقّق. تأكّدي من الشبكة وأعيدي المحاولة — لن يُخصم منك شيء إضافي.</div>`);
  } finally{
    btn.disabled = false;
    btn.textContent = "تحقّقي من الدفع";
    check();
  }
};

render();
</script>
</body>
</html>
